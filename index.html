<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><rect width=%22512%22 height=%22512%22 rx=%22115%22 fill=%22%234f46e5%22/><path fill=%22%23ffffff%22 transform=%22translate(102, 102) scale(0.6)%22 d=%22M64 32C28.7 32 0 60.7 0 96V416c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V192c0-35.3-28.7-64-64-64H80c-8.8 0-16-7.2-16-16s7.2-16 16-16H448c17.7 0 32-14.3 32-32s-14.3-32-32-32H64zM416 272a32 32 0 1 1 0 64 32 32 0 1 1 0-64z%22/></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataWallet - Autenticando...</title>

    <link rel="icon" type="image/png" href="favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- LIGAÇÃO COM O BANCO DE DADOS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- ARQUIVO NA RAIZ (Sem a pasta js/) -->
    <script src="config.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                if (typeof supabaseClient === 'undefined') {
                    throw new Error("Arquivo config.js não encontrado.");
                }

                const { data: { session }, error } = await supabaseClient.auth.getSession();
                
                if (error) throw error;

                if (session) {
                    window.location.replace('movimentacoes.html');
                } else {
                    window.location.replace('login.html');
                }
            } catch (erro) {
                console.error("FALHA NO ROTEADOR:", erro.message);
                window.location.replace('login.html'); 
            }
        });
    </script>
</head>
<body class="bg-gradient-to-br from-blue-900 to-gray-900 flex items-center justify-center h-screen">
    <div class="text-white text-xl font-bold flex flex-col items-center gap-4">
        <i class="fa-solid fa-spinner fa-spin text-blue-500 text-5xl"></i> 
        <span class="tracking-widest">Inicializando Cofre de Segurança...</span>
        <p class="text-xs text-gray-400 font-normal mt-2 text-center max-w-xs">
            Verificando credenciais de acesso...
        </p>
    </div>
</body>
</html>
