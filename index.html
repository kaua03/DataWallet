<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DataWallet</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDK SUPABASE E MOTORES DO APP -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js" defer></script>
    <script src="js/app.js" defer></script>
    
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        ::-webkit-scrollbar { display: none; }
        .scroll-suave { overflow-x: auto; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .scroll-suave::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen overflow-hidden flex flex-col md:flex-row relative">

    <!-- Escudo Protetor Inicial (Preto enquanto carrega) -->
    <div id="loader-seguranca" class="fixed inset-0 bg-gray-900 z-50 flex items-center justify-center">
        <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-500"></i>
    </div>

    <!-- MENU LATERAL (PC) -->
    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200 p-6 h-full shadow-lg z-20">
        <div class="flex items-center gap-3 mb-10">
            <i class="fa-solid fa-wallet text-blue-600 text-3xl"></i>
            <h2 class="text-2xl font-black text-gray-900 tracking-tight">DataWallet</h2>
        </div>
        <nav class="flex-1 space-y-2">
            <button onclick="mudarAba('movimentacao')" id="nav-desk-movimentacao" class="menu-desk w-full flex items-center gap-3 p-3 rounded-xl font-bold bg-blue-50 text-blue-600 transition"><i class="fa-solid fa-money-bill-transfer w-5"></i> Início</button>
            <button onclick="mudarAba('dashboard')" id="nav-desk-dashboard" class="menu-desk w-full flex items-center gap-3 p-3 rounded-xl font-bold text-gray-500 hover:bg-gray-50 transition"><i class="fa-solid fa-chart-pie w-5"></i> Dashboard</button>
            <button onclick="mudarAba('dividas')" id="nav-desk-dividas" class="menu-desk w-full flex items-center gap-3 p-3 rounded-xl font-bold text-gray-500 hover:bg-gray-50 transition"><i class="fa-solid fa-file-invoice-dollar w-5"></i> Dívidas</button>
            <button onclick="mudarAba('categorias')" id="nav-desk-categorias" class="menu-desk w-full flex items-center gap-3 p-3 rounded-xl font-bold text-gray-500 hover:bg-gray-50 transition"><i class="fa-solid fa-layer-group w-5"></i> Categorias</button>
            <button onclick="mudarAba('planos')" id="nav-desk-planos" class="menu-desk w-full flex items-center gap-3 p-3 rounded-xl font-bold text-gray-500 hover:bg-gray-50 transition"><i class="fa-solid fa-bullseye w-5"></i> Planos</button>
        </nav>
        <button onclick="sair()" class="flex items-center gap-3 p-3 rounded-xl font-bold text-red-500 hover:bg-red-50 transition mt-auto">
            <i class="fa-solid fa-right-from-bracket w-5"></i> Sair
        </button>
    </aside>

    <!-- ÁREA CENTRAL DE CONTEÚDO (As Salas) -->
    <main class="flex-1 h-full overflow-y-auto bg-gray-50 relative pb-24 md:pb-0">
        
        <!-- SALA 1: INÍCIO -->
        <section id="aba-movimentacao" class="aba-conteudo p-4 md:p-8 max-w-5xl mx-auto fade-in">
            <div class="bg-gradient-to-br from-blue-900 to-gray-900 text-white p-6 md:p-10 rounded-[2rem] shadow-xl mb-6 flex flex-col md:flex-row md:items-center justify-between relative overflow-hidden">
                <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-white opacity-5 blur-2xl"></div>
                <div class="z-10">
                    <p class="text-blue-200 text-sm font-medium flex items-center gap-2"><i class="fa-solid fa-building-columns"></i> Saldo Disponível</p>
                    <h2 class="text-4xl md:text-5xl font-black mt-1 tracking-tight" id="saldo-tela">R$ 0,00</h2>
                </div>
                <div class="mt-6 md:mt-0 w-full md:w-[450px] bg-white/10 p-1.5 rounded-2xl flex items-center backdrop-blur-md border border-white/20 z-10 shadow-lg">
                    <button class="p-3 text-blue-200 hover:text-white transition"><i class="fa-solid fa-microphone"></i></button>
                    <input type="text" id="input-magico" placeholder="Ex: Recebi 2500 de salário ou Ifood 45" class="flex-1 bg-transparent outline-none text-white placeholder-blue-200 px-2 font-medium">
                    <button onclick="simularEnvioVoz()" class="bg-white text-gray-900 p-3 rounded-xl hover:bg-blue-500 hover:text-white transition shadow-md flex items-center gap-2">
                        <span class="hidden md:inline font-bold text-sm">Registrar</span>
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-green-100 text-green-500 flex justify-center items-center text-xl"><i class="fa-solid fa-arrow-trend-up"></i></div>
                    <div><p class="text-gray-400 text-xs font-bold uppercase">Entradas</p><p class="text-gray-800 font-black text-lg" id="total-entradas">R$ 0,00</p></div>
                </div>
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-red-100 text-red-500 flex justify-center items-center text-xl"><i class="fa-solid fa-arrow-trend-down"></i></div>
                    <div><p class="text-gray-400 text-xs font-bold uppercase">Saídas</p><p class="text-gray-800 font-black text-lg" id="total-saidas">R$ 0,00</p></div>
                </div>
            </div>

            <h3 class="text-gray-800 font-black text-lg mb-4">Histórico de Transações</h3>
            <div id="lista-extrato" class="space-y-3"></div>
        </section>

        <!-- SALA 2: DASHBOARD -->
        <section id="aba-dashboard" class="aba-conteudo hidden p-4 md:p-8 max-w-5xl mx-auto fade-in">
            <h2 class="text-2xl font-black text-gray-900 flex items-center gap-2 mb-6"><i class="fa-solid fa-chart-pie text-blue-600"></i> Inteligência e Análise</h2>
            <div class="bg-indigo-900 text-white p-6 rounded-3xl shadow-lg flex items-center gap-6 mb-8">
                <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center text-3xl"><i class="fa-solid fa-robot text-indigo-200"></i></div>
                <div><h3 class="font-bold text-xl mb-2">Seu Coach Financeiro</h3><p class="text-indigo-50 text-sm" id="texto-coach"></p></div>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm mb-6">
                <h3 class="font-bold mb-4">Para onde seu dinheiro vai</h3><div id="grafico-categorias" class="space-y-4"></div>
            </div>
        </section>

        <!-- SALA 3: DÍVIDAS -->
        <section id="aba-dividas" class="aba-conteudo hidden p-4 md:p-8 max-w-5xl mx-auto fade-in">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black text-gray-900 flex items-center gap-2"><i class="fa-solid fa-file-invoice-dollar text-blue-600"></i> Controle de Dívidas</h2>
                <button onclick="abrirModalDivida()" class="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl text-sm shadow-md transition">+ Nova Dívida</button>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm"><div id="col-div-atual" class="space-y-3"></div></div>
        </section>

        <!-- SALA 4: CATEGORIAS -->
        <section id="aba-categorias" class="aba-conteudo hidden p-4 md:p-8 max-w-5xl mx-auto fade-in">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black text-gray-900 flex items-center gap-2"><i class="fa-solid fa-layer-group text-blue-600"></i> Pastas</h2>
                <button onclick="abrirModalCategoria()" class="text-blue-600 font-bold bg-blue-50 px-4 py-2 rounded-xl text-sm transition">+ Nova Categoria</button>
            </div>
            <div id="grid-categorias" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </section>
        
        <!-- SALA 5: PLANOS -->
        <section id="aba-planos" class="aba-conteudo hidden p-4 md:p-8 max-w-5xl mx-auto fade-in">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black text-gray-900 flex items-center gap-2"><i class="fa-solid fa-bullseye text-blue-600"></i> Metas</h2>
                <button onclick="abrirModalAporte()" class="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl text-sm shadow-md transition">+ Guardar</button>
            </div>
            <div id="grid-planos" class="space-y-4"></div>
        </section>
    </main>

    <!-- MENU CELULAR E MODAIS (Inclua seus modais flutuantes do código anterior aqui para economizar espaço) -->
    <!-- ... Copie e cole aqui o seu <nav class="md:hidden..."> e todas as <div> de modais ... -->
</body>
</html>
