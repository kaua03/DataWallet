<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataWallet - Autenticando...</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- LIGAÇÃO COM O BANCO DE DADOS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    
    <script>
        // O Roteador Inteligente
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.replace('movimentacoes.html'); // Logado vai para o Início
            } else {
                window.location.replace('login.html'); // Deslogado vai para a Rua
            }
        });
    </script>
</head>
<body class="bg-gradient-to-br from-blue-900 to-gray-900 flex items-center justify-center h-screen">
    <!-- Tela preta elegante enquanto o sistema decide a rota -->
    <div class="text-white text-xl font-bold flex items-center gap-3">
        <i class="fa-solid fa-spinner fa-spin text-blue-500 text-3xl"></i> 
        <span>Inicializando Cofre de Segurança...</span>
    </div>
</body>
</html>
