<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataWallet - Inteligência Financeira</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { display: none; }
        .escondido { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen overflow-hidden flex">

    <!-- ========================================== -->
    <!-- TELA DE LOGIN -->
    <!-- ========================================== -->
    <div id="tela-login" class="w-full h-full flex items-center justify-center bg-gradient-to-br from-blue-900 to-gray-900 absolute z-50 fade-in">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm mx-4 relative overflow-hidden">
            
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 shadow-inner">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <h1 class="text-2xl font-black text-gray-900">DataWallet</h1>
                <p class="text-sm text-gray-500">Seu centro de inteligência financeira</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">E-mail</label>
                    <input type="email" id="email-login" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 transition" placeholder="seu@email.com">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Senha</label>
                    <input type="password" id="senha-login" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 transition" placeholder="••••••••">
                </div>
                
                <button onclick="fazerLoginTradicional()" class="w-full bg-gray-900 text-white font-bold py-3 rounded-xl hover:bg-blue-600 transition shadow-lg flex justify-center items-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Entrar
                </button>
                
                <!-- ÁREA DE BIOMETRIA (Nasce escondida, o JS decide se mostra) -->
                <div id="area-biometria" class="escondido">
                    <div class="relative flex items-center justify-center mt-6 mb-4">
                        <div class="border-t border-gray-200 w-full absolute"></div>
                        <span class="bg-white px-3 text-xs font-bold text-gray-400 relative tracking-wider">OU ACESSE COM</span>
                    </div>
                    
                    <button onclick="fazerLoginBiometrico()" class="w-full bg-gray-50 text-gray-800 border border-gray-200 font-bold py-3 rounded-xl hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 transition flex items-center justify-center gap-3">
                        <i class="fa-solid fa-fingerprint text-2xl"></i> 
                        <span>Face ID / Digital</span>
                    </button>
                </div>
                <!-- FIM ÁREA DE BIOMETRIA -->

            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ESTRUTURA PRINCIPAL DO APP (Omitida para focar no Login, O RESTO CONTINUA IGUAL!) -->
    <!-- ========================================== -->
    <div id="app-principal" class="escondido w-full h-full flex flex-col md:flex-row">
        <!-- COLOQUE AQUI O CÓDIGO DA BARRA LATERAL, MAIN E NAV DO ARQUIVO ANTERIOR -->
        <!-- Para não ficar um arquivo monstruoso na resposta, você já tem essa parte.
             Ela é a que começa com <aside class="hidden md:flex... até o final do <nav> do celular -->
        
        <div class="flex items-center justify-center w-full h-full bg-gray-100">
             <h2 class="text-2xl font-bold text-gray-400">Você entrou no sistema! (Conteúdo das abas mantido)</h2>
        </div>
    </div>

    <!-- O Cérebro do Frontend (JavaScript) -->
    <script>
        // ==========================================
        // 1. INTELIGÊNCIA DE HARDWARE (Investigador de Biometria)
        // ==========================================
        async function verificarBiometria() {
            // Pergunta se o navegador suporta a tecnologia base
            if (window.PublicKeyCredential) {
                try {
                    // Pergunta ao Sistema Operacional se existe um leitor físico instalado
                    const temHardware = await window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
                    
                    if (temHardware) {
                        // Se tiver, removemos a classe "escondido" e a mágica acontece
                        document.getElementById('area-biometria').classList.remove('escondido');
                    } else {
                        console.log("Hardware de biometria não detectado neste dispositivo.");
                    }
                } catch (erro) {
                    console.log("Erro ao checar biometria:", erro);
                }
            }
        }

        // Rodamos a investigação assim que o aplicativo abre
        verificarBiometria();

        // ==========================================
        // 2. COMUNICAÇÃO COM O PYTHON (A ser implementada no próximo passo)
        // ==========================================
        function fazerLoginTradicional() {
            // Aqui vamos pegar o email e a senha digitados e enviar para o Python validar no Supabase
            const email = document.getElementById('email-login').value;
            const senha = document.getElementById('senha-login').value;
            
            if(!email || !senha) {
                alert("Preencha todos os campos!");
                return;
            }
            
            // Simulação provisória de sucesso
            document.getElementById('tela-login').classList.add('escondido');
            document.getElementById('app-principal').classList.remove('escondido');
        }

        function fazerLoginBiometrico() {
            alert("A API WebAuthn será acionada aqui para ler seu rosto/dedo!");
        }
    </script>
</body>
</html>
