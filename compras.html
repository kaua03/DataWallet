<!DOCTYPE html>
<html lang="pt-BR" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mercado - DataWallet</title>
    
    <meta name="view-transition" content="same-origin">
    
    <script>
        const temaSalvo = localStorage.getItem('DataWallet_Tema') || localStorage.getItem('theme');
        if (temaSalvo === 'escuro' || temaSalvo === 'dark' || (!temaSalvo && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#020617';
        } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f8fafc';
        }
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' }; </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module"></script>
    
    <script src="config.js" defer></script>
    <script src="layout.js" defer></script>
    <script src="compras.js" defer></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; overscroll-behavior-y: none; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        ::-webkit-scrollbar { width: 6px; display: none; }
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        
        /* Ajuste visual para a lista de autocomplete */
        .autocomplete-item { transition: background-color 0.2s; }
        .autocomplete-item:active { background-color: #e2e8f0; }
        .dark .autocomplete-item:active { background-color: #334155; }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 h-[100dvh] overflow-hidden flex relative fade-in transition-colors duration-300">

    <main class="flex-1 h-full flex flex-col relative">
        
        <header class="bg-indigo-600 dark:bg-indigo-900 text-white p-5 md:p-8 rounded-b-3xl md:rounded-b-[3rem] shadow-lg shadow-indigo-600/20 relative z-20 shrink-0 mx-0 md:mx-4 md:mt-4 transition-colors">
            <div class="max-w-4xl mx-auto flex justify-between items-center">
                <div>
                    <h2 class="text-xs md:text-sm font-bold text-indigo-200 uppercase tracking-widest mb-1 flex items-center gap-2">
                        <i class="fa-solid fa-cart-shopping"></i> Total da Compra
                    </h2>
                    <h1 class="text-4xl md:text-5xl font-black tracking-tighter" id="total-carrinho">R$ 0,00</h1>
                    <p class="text-xs text-indigo-200 mt-1 font-medium"><span id="qtd-itens-carrinho">0</span> itens no carrinho</p>
                </div>
                <button onclick="abrirModalCheckout()" id="btn-finalizar-topo" class="hidden md:flex bg-emerald-500 hover:bg-emerald-400 text-white font-black px-6 py-4 rounded-2xl shadow-lg transition-transform active:scale-95 items-center gap-2">
                    Finalizar <i class="fa-solid fa-check"></i>
                </button>
            </div>
        </header>

        <section class="max-w-4xl mx-auto w-full px-4 pt-6 pb-2 shrink-0 relative z-10">
            <div class="relative bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200/60 dark:border-slate-800 focus-within:border-indigo-500 focus-within:ring-4 focus-within:ring-indigo-500/10 transition-all flex items-center p-2">
                <div class="w-12 h-12 bg-slate-100 dark:bg-slate-800 rounded-xl flex items-center justify-center text-slate-400 shrink-0">
                    <i class="fa-solid fa-barcode text-xl"></i>
                </div>
                <input type="text" id="input-busca-produto" oninput="buscarProdutosAutocompletar()" placeholder="Qual produto você pegou?" class="w-full bg-transparent border-none outline-none px-4 py-2 font-bold text-slate-900 dark:text-white placeholder-slate-400 text-lg">
                <button onclick="limparBusca()" id="btn-limpar-busca" class="hidden w-10 h-10 text-slate-400 hover:text-rose-500 flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div id="box-autocomplete" class="hidden absolute top-[85px] left-4 right-4 bg-white dark:bg-slate-900 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.1)] border border-slate-200 dark:border-slate-800 overflow-hidden z-30 max-h-64 overflow-y-auto">
                </div>
        </section>

        <section class="flex-1 overflow-y-auto px-4 pb-32 md:pb-8 pt-2" style="scrollbar-width: none;">
            <div class="max-w-4xl mx-auto">
                <div id="lista-carrinho" class="space-y-3">
                    <div class="flex flex-col items-center justify-center py-20 opacity-60">
                        <dotlottie-wc src="https://lottie.host/7e008fa9-2de6-455b-baf5-0e1ce8b8fcfa/R8B5B1bN9C.json" style="width: 150px; height: 150px;" autoplay loop></dotlottie-wc>
                        <p class="text-sm font-bold text-slate-500 dark:text-slate-400 mt-2 text-center max-w-[250px]">O carrinho está vazio.<br>Busque um produto acima para começar.</p>
                    </div>
                </div>
            </div>
        </section>

        <div id="box-finalizar-mobile" class="md:hidden fixed bottom-6 left-4 right-4 z-40 hidden fade-in">
            <button onclick="abrirModalCheckout()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-4 rounded-2xl shadow-[0_10px_25px_rgba(16,185,129,0.4)] flex justify-center items-center gap-2 text-lg active:scale-95 transition-transform border border-emerald-400">
                <i class="fa-solid fa-cash-register"></i> Finalizar Compra
            </button>
        </div>
    </main>

    <div id="modal-produto" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-end md:items-center justify-center p-0 md:p-4 fade-in">
        <div class="bg-white dark:bg-slate-900 w-full md:max-w-md rounded-t-3xl md:rounded-3xl shadow-2xl relative border-t md:border border-slate-200 dark:border-slate-800 flex flex-col max-h-[90vh]">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full mx-auto mt-3 mb-2 md:hidden"></div>
            
            <div class="p-6 overflow-y-auto" style="scrollbar-width: none;">
                <button type="button" onclick="fecharModalProduto()" class="absolute top-5 right-5 w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 hover:bg-rose-500 hover:text-white transition flex items-center justify-center active:scale-95">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                
                <h3 id="modal-produto-titulo" class="text-2xl font-black text-slate-900 dark:text-white pr-10 mb-2 leading-tight">Nome do Produto</h3>
                
                <div id="box-inteligencia-preco" class="hidden mb-6 p-3 rounded-xl border flex items-center gap-3">
                    <div id="icone-inteligencia" class="w-10 h-10 rounded-full flex items-center justify-center text-lg shrink-0"></div>
                    <div>
                        <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Análise de Preço</p>
                        <p id="texto-inteligencia" class="text-xs font-black"></p>
                    </div>
                </div>

                <form id="form-produto" onsubmit="salvarItemCarrinho(event)" class="space-y-5">
                    <input type="hidden" id="prod-id">
                    <input type="hidden" id="prod-nome">
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-2">Preço Unitário (R$)</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-xl">R$</span>
                            <input type="text" id="prod-preco" inputmode="numeric" oninput="aplicarMascaraMoeda(this); calcularTotalItemModal();" required placeholder="0,00" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white rounded-2xl pl-12 pr-4 py-4 outline-none focus:border-indigo-500 font-black text-3xl">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-2">Quantidade</label>
                        <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl p-2">
                            <button type="button" onclick="ajustarQtd(-1)" class="w-14 h-14 rounded-xl bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 shadow-sm flex items-center justify-center text-2xl active:bg-slate-200 dark:active:bg-slate-800 transition-colors"><i class="fa-solid fa-minus"></i></button>
                            <input type="number" id="prod-qtd" value="1" min="1" step="1" inputmode="numeric" oninput="calcularTotalItemModal()" class="w-20 bg-transparent text-center font-black text-3xl text-slate-900 dark:text-white outline-none">
                            <button type="button" onclick="ajustarQtd(1)" class="w-14 h-14 rounded-xl bg-indigo-100 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 shadow-sm flex items-center justify-center text-2xl active:bg-indigo-200 dark:active:bg-indigo-500/30 transition-colors"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>

                    <div class="pt-4 flex justify-between items-center border-t border-slate-100 dark:border-slate-800">
                        <span class="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest">Subtotal</span>
                        <span class="text-2xl font-black text-indigo-600 dark:text-indigo-400" id="prod-subtotal">R$ 0,00</span>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-indigo-500/30 mt-2 flex justify-center items-center gap-2 active:scale-95 transition-transform text-lg">
                        Adicionar ao Carrinho <i class="fa-solid fa-cart-plus"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div id="modal-checkout" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl shadow-2xl relative border border-slate-200 dark:border-slate-800 flex flex-col p-6 md:p-8">
            <button type="button" onclick="fecharModalCheckout()" class="absolute top-5 right-5 w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 hover:bg-rose-500 hover:text-white transition flex items-center justify-center active:scale-95">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <h3 class="text-2xl font-black text-slate-900 dark:text-white mb-1">Finalizar Compra</h3>
            <p class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-6">Como você vai pagar este mercado?</p>

            <div class="bg-slate-50 dark:bg-slate-950 rounded-2xl p-4 mb-6 border border-slate-200 dark:border-slate-800 flex justify-between items-center">
                <span class="text-sm font-bold text-slate-500 uppercase">Valor a Pagar</span>
                <span class="text-2xl font-black text-emerald-600 dark:text-emerald-400" id="checkout-total">R$ 0,00</span>
            </div>

            <form id="form-checkout" onsubmit="efetivarCompra(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-2">Forma de Pagamento</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="cursor-pointer relative">
                            <input type="radio" name="pagamento" value="avista" class="peer sr-only" checked onchange="toggleParcelasCheckout()">
                            <div class="p-3 text-center rounded-xl border border-slate-200 dark:border-slate-700 font-bold text-sm text-slate-500 dark:text-slate-400 peer-checked:bg-emerald-50 dark:peer-checked:bg-emerald-500/10 peer-checked:border-emerald-500 peer-checked:text-emerald-600 dark:peer-checked:text-emerald-400 transition-all">
                                <i class="fa-solid fa-money-bill-wave block mb-1 text-lg"></i> À Vista / Pix / Débito
                            </div>
                        </label>
                        <label class="cursor-pointer relative">
                            <input type="radio" name="pagamento" value="credito" class="peer sr-only" onchange="toggleParcelasCheckout()">
                            <div class="p-3 text-center rounded-xl border border-slate-200 dark:border-slate-700 font-bold text-sm text-slate-500 dark:text-slate-400 peer-checked:bg-indigo-50 dark:peer-checked:bg-indigo-500/10 peer-checked:border-indigo-500 peer-checked:text-indigo-600 dark:peer-checked:text-indigo-400 transition-all">
                                <i class="fa-solid fa-credit-card block mb-1 text-lg"></i> Cartão de Crédito
                            </div>
                        </label>
                    </div>
                </div>

                <div id="box-parcelas" class="hidden grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Parcelas</label>
                        <select id="checkout-parcelas" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white rounded-xl px-3 py-3 outline-none font-bold">
                            <option value="1">1x (Venc. p/ Mês que vem)</option>
                            <option value="2">2x sem juros</option>
                            <option value="3">3x sem juros</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">1º Vencimento</label>
                        <input type="date" id="checkout-data" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white rounded-xl px-3 py-2.5 outline-none font-bold" style="color-scheme: dark;">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Qual Supermercado?</label>
                    <input type="text" id="checkout-desc" required placeholder="Ex: Mart Minas, Carrefour..." value="Compra no Mercado" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white rounded-xl px-4 py-3 outline-none focus:border-indigo-500 font-medium">
                </div>

                <button type="submit" id="btn-processar-compra" class="w-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-black py-4 rounded-xl shadow-lg mt-4 flex justify-center items-center gap-2 active:scale-95 transition-transform text-lg">
                    Confirmar Compra
                </button>
            </form>
        </div>
    </div>

</body>
</html>
