<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - DataWallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' }; </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="login.js" defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @keyframes shimmer {
            0% { transform: translateX(-150%) skewX(-20deg); }
            100% { transform: translateX(300%) skewX(-20deg); }
        }
        .btn-shine { position: relative; overflow: hidden; }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.25), transparent);
            animation: shimmer 3.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-[100dvh] flex items-center justify-center p-4 relative overflow-hidden">
    
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-[20%] -left-[10%] w-[70%] h-[70%] bg-blue-600/20 blur-[120px] rounded-full"></div>
        <div class="absolute -bottom-[20%] -right-[10%] w-[60%] h-[60%] bg-cyan-600/10 blur-[100px] rounded-full"></div>
    </div>

    <main class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-[2rem] shadow-2xl z-10 fade-in relative">
        
        <button type="button" id="btn-voltar" class="hidden absolute top-6 left-6 w-10 h-10 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white rounded-full flex items-center justify-center transition-colors shadow-sm z-20">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <!-- O MASCOTE (Combo Chart Vivo) -->
        <div class="relative w-40 h-28 mx-auto mb-4 flex items-end justify-center gap-3 px-4 bg-slate-950/60 rounded-2xl border border-slate-800/80 shadow-inner py-3 mt-4" id="mascot-container">
            
            <div class="w-7 h-12 bg-slate-800 rounded-t-lg border-t border-x border-slate-700 transition-all duration-300"></div>
            
            <div id="bar-left" class="relative w-9 h-16 bg-blue-600/30 rounded-t-lg border-t border-x border-blue-500/50 flex flex-col justify-start items-center pt-2 transition-all duration-300 shadow-[0_0_15px_rgba(59,130,246,0.2)] z-10">
                <div class="relative w-4 h-4 bg-white rounded-full overflow-hidden flex items-center justify-center">
                    <div id="pupil-l" class="w-2 h-2 bg-slate-950 rounded-full transition-transform duration-75"></div>
                    <div id="eyelid-l" class="absolute inset-0 bg-blue-900 origin-top scale-y-0 transition-transform duration-150"></div>
                </div>
            </div>

            <div id="bar-right" class="relative w-9 h-20 bg-blue-600/40 rounded-t-lg border-t border-x border-blue-500/60 flex flex-col justify-start items-center pt-2 transition-all duration-300 shadow-[0_0_15px_rgba(59,130,246,0.3)] z-10">
                <div class="relative w-4 h-4 bg-white rounded-full overflow-hidden flex items-center justify-center">
                    <div id="pupil-r" class="w-2 h-2 bg-slate-950 rounded-full transition-transform duration-75"></div>
                    <div id="eyelid-r" class="absolute inset-0 bg-blue-900 origin-top scale-y-0 transition-transform duration-150"></div>
                </div>
            </div>

            <div class="w-7 h-10 bg-slate-800 rounded-t-lg border-t border-x border-slate-700 transition-all duration-300"></div>

            <!-- 🟢 O Gráfico de Linha (A Boca Neutra Inicial) -->
            <svg class="absolute inset-0 w-full h-full pointer-events-none drop-shadow-[0_0_6px_rgba(34,211,238,0.4)] z-20" viewBox="0 0 160 112">
                <path id="mouth-line" d="M 25,85 L 60,85 L 100,85 L 135,85" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="transition-all duration-300 ease-out"/>
                
                <circle id="mouth-p1" cx="25" cy="85" r="3.5" fill="#020617" stroke="#22d3ee" stroke-width="2" class="transition-all duration-300 ease-out"/>
                <circle id="mouth-p2" cx="60" cy="85" r="3.5" fill="#020617" stroke="#22d3ee" stroke-width="2" class="transition-all duration-300 ease-out"/>
                <circle id="mouth-p3" cx="100" cy="85" r="3.5" fill="#020617" stroke="#22d3ee" stroke-width="2" class="transition-all duration-300 ease-out"/>
                <circle id="mouth-p4" cx="135" cy="85" r="3.5" fill="#020617" stroke="#22d3ee" stroke-width="2" class="transition-all duration-300 ease-out"/>
            </svg>

        </div>

        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-white tracking-tight" id="titulo-form">Acesso Seguro</h1>
            <p class="text-sm text-slate-400 font-medium mt-1" id="subtitulo-form">Analytics & Inteligência Financeira.</p>
        </div>

        <form id="form-auth" class="space-y-4">
            
            <div id="box-email">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1" id="label-identificador">E-mail ou Usuário</label>
                <div class="group relative flex items-center bg-slate-950 rounded-xl border border-slate-800 transition-all duration-300 focus-within:-translate-y-1 focus-within:shadow-[0_10px_25px_rgba(59,130,246,0.15)] focus-within:border-blue-500">
                    <i class="fa-solid fa-user absolute left-4 text-slate-500 transition-colors duration-300 group-focus-within:text-blue-400" id="icon-identificador"></i>
                    <input type="text" id="identificador" required class="w-full bg-transparent text-white pl-11 pr-4 py-3.5 outline-none font-medium lowercase">
                </div>
            </div>

            <div id="box-username" class="hidden opacity-0 transition-all duration-300">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Usuário</label>
                <div class="group relative flex items-center bg-slate-950 rounded-xl border border-slate-800 transition-all duration-300 focus-within:-translate-y-1 focus-within:shadow-[0_10px_25px_rgba(59,130,246,0.15)] focus-within:border-blue-500">
                    <i class="fa-solid fa-at absolute left-4 text-slate-500 transition-colors duration-300 group-focus-within:text-blue-400"></i>
                    <input type="text" id="username" class="w-full bg-transparent text-white pl-11 pr-4 py-3.5 outline-none font-medium lowercase">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Senha</label>
                <div class="group relative flex items-center bg-slate-950 rounded-xl border border-slate-800 transition-all duration-300 focus-within:-translate-y-1 focus-within:shadow-[0_10px_25px_rgba(59,130,246,0.15)] focus-within:border-blue-500">
                    <i class="fa-solid fa-lock absolute left-4 text-slate-500 transition-colors duration-300 group-focus-within:text-blue-400"></i>
                    <input type="password" id="senha" required class="w-full bg-transparent text-white pl-11 pr-12 py-3.5 outline-none font-medium tracking-widest">
                    <button type="button" id="toggle-pass" class="absolute right-4 text-slate-400 hover:text-blue-400 transition-colors p-1">
                        <i id="icon-pass" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div id="box-lgpd" class="hidden items-start gap-3 mt-4 bg-slate-950/50 p-3 rounded-xl border border-slate-800/50">
                <input type="checkbox" id="check-lgpd" class="mt-1 w-4 h-4 rounded border-slate-700 text-blue-600 bg-slate-900 focus:ring-blue-500">
                <label for="check-lgpd" class="text-xs text-slate-400 leading-relaxed cursor-pointer select-none">
                    Declaro que li e concordo com a <a href="#" class="text-blue-400 hover:underline font-bold">Política de Privacidade</a> e autorizo o tratamento seguro dos meus dados (LGPD).
                </label>
            </div>

            <button type="submit" id="btn-submit" class="group btn-shine w-full bg-blue-600 hover:bg-blue-500 text-white font-black text-lg py-4 rounded-xl shadow-[0_10px_20px_rgba(37,99,235,0.3)] hover:shadow-[0_15px_30px_rgba(37,99,235,0.5)] transition-all duration-300 hover:-translate-y-1 active:scale-[0.98] mt-6 flex items-center justify-center gap-2">
                Acessar <i class="fa-solid fa-arrow-right transition-transform duration-300 group-hover:translate-x-1.5"></i>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-slate-800 pt-6" id="box-rodape">
            <p class="text-sm text-slate-400 font-medium">
                <span id="texto-rodape">Ainda não tem cadastro?</span> 
                <button type="button" id="btn-toggle-mode" class="text-blue-400 font-bold hover:text-blue-300 ml-1 transition-colors">Criar Conta</button>
            </p>
        </div>
    </main>
</body>
</html>
