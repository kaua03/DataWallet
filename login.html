<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - DataWallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' }; </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="login.js" defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-[100dvh] flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Fundo abstrato premium -->
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-[20%] -left-[10%] w-[70%] h-[70%] bg-indigo-600/20 blur-[120px] rounded-full"></div>
        <div class="absolute -bottom-[20%] -right-[10%] w-[60%] h-[60%] bg-emerald-600/10 blur-[100px] rounded-full"></div>
    </div>

    <main class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-[2rem] shadow-2xl z-10 fade-in relative">
        
        <!-- O MASCOTE: Cofre Guardião -->
        <div class="relative w-32 h-32 mx-auto mb-6">
            <!-- Corpo do Cofre -->
            <div class="absolute inset-0 bg-slate-800 rounded-3xl border-[5px] border-slate-700 shadow-2xl flex flex-col items-center pt-5 z-10">
                
                <!-- Visor Digital (Onde ficam os olhos) -->
                <div class="w-24 h-12 bg-slate-950 rounded-xl relative overflow-hidden flex items-center justify-center gap-4 shadow-inner border border-slate-900/50">
                    
                    <!-- Olho Esquerdo -->
                    <div class="relative w-6 h-6 bg-white rounded-full overflow-hidden flex items-center justify-center shadow-[0_0_15px_rgba(255,255,255,0.2)]">
                        <!-- Pupila -->
                        <div id="pupil-l" class="w-3 h-3 bg-slate-900 rounded-full transition-transform duration-75 ease-out"></div>
                        <!-- Pálpebra (Animação de Piscar/Fechar) -->
                        <div id="eyelid-l" class="absolute top-0 left-0 w-full h-full bg-slate-950 origin-top scale-y-0 transition-transform duration-150"></div>
                    </div>
                    
                    <!-- Olho Direito -->
                    <div class="relative w-6 h-6 bg-white rounded-full overflow-hidden flex items-center justify-center shadow-[0_0_15px_rgba(255,255,255,0.2)]">
                        <!-- Pupila -->
                        <div id="pupil-r" class="w-3 h-3 bg-slate-900 rounded-full transition-transform duration-75 ease-out"></div>
                        <!-- Pálpebra (Animação de Piscar/Fechar) -->
                        <div id="eyelid-r" class="absolute top-0 left-0 w-full h-full bg-slate-950 origin-top scale-y-0 transition-transform duration-150"></div>
                    </div>
                </div>
                
                <!-- Dial (Tranca do Cofre que vai girar) -->
                <div id="vault-dial" class="w-10 h-10 mt-3 rounded-full bg-slate-700 border-2 border-slate-600 shadow-lg flex items-start justify-center pt-1 transition-transform duration-75 ease-out">
                    <div class="w-1.5 h-3 bg-indigo-400 rounded-full"></div>
                </div>
            </div>
            
            <!-- Detalhes do cofre (Dobradiças) -->
            <div class="absolute top-6 -left-1 w-2 h-6 bg-slate-600 rounded-l-md z-0"></div>
            <div class="absolute bottom-6 -left-1 w-2 h-6 bg-slate-600 rounded-l-md z-0"></div>
        </div>

        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-white tracking-tight" id="titulo-form">Acesso Seguro</h1>
            <p class="text-sm text-slate-400 font-medium mt-1" id="subtitulo-form">O seu guardião de dados financeiros.</p>
        </div>

        <form id="form-auth" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">E-mail Corporativo / Pessoal</label>
                <div class="relative flex items-center">
                    <i class="fa-solid fa-envelope absolute left-4 text-slate-500"></i>
                    <input type="email" id="email" required placeholder="kaua@exemplo.com" class="w-full bg-slate-950 border border-slate-800 text-white rounded-xl pl-11 pr-4 py-3.5 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all font-medium">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Senha Segura</label>
                <div class="relative flex items-center">
                    <i class="fa-solid fa-lock absolute left-4 text-slate-500"></i>
                    <input type="password" id="senha" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 text-white rounded-xl pl-11 pr-12 py-3.5 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all font-medium tracking-widest">
                    <button type="button" id="toggle-pass" class="absolute right-4 text-slate-400 hover:text-indigo-400 transition-colors p-1">
                        <i id="icon-pass" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- LGPD Checkbox -->
            <div id="box-lgpd" class="hidden items-start gap-3 mt-4 bg-slate-950/50 p-3 rounded-xl border border-slate-800/50">
                <input type="checkbox" id="check-lgpd" class="mt-1 w-4 h-4 rounded border-slate-700 text-indigo-600 bg-slate-900 focus:ring-indigo-500">
                <label for="check-lgpd" class="text-xs text-slate-400 leading-relaxed cursor-pointer select-none">
                    Declaro que li e concordo com a <a href="#" class="text-indigo-400 hover:underline font-bold">Política de Privacidade</a> e autorizo o tratamento seguro dos meus dados (LGPD).
                </label>
            </div>

            <button type="submit" id="btn-submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black text-lg py-4 rounded-xl shadow-[0_10px_20px_rgba(79,70,229,0.3)] transition-all active:scale-[0.98] mt-4 flex items-center justify-center gap-2">
                Desbloquear Cofre <i class="fa-solid fa-unlock-keyhole"></i>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-slate-800 pt-6">
            <p class="text-sm text-slate-400 font-medium">
                <span id="texto-rodape">Ainda não faz parte da elite?</span> 
                <button type="button" id="btn-toggle-mode" class="text-indigo-400 font-bold hover:text-indigo-300 ml-1 transition-colors">Criar Conta</button>
            </p>
        </div>
    </main>
</body>
</html>
