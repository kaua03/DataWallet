<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DataWallet</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDK OFICIAL SUPABASE E NOSSOS MOTORES NA RAIZ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="login.js" defer></script>
    
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-900 to-gray-900 h-screen w-full flex items-center justify-center font-sans relative overflow-hidden">

    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <div class="w-96 h-96 bg-white opacity-5 rounded-full blur-3xl"></div>
    </div>

    <div id="login-container" class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm mx-4 relative z-10 transition-all duration-300 fade-in">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 shadow-inner">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <h1 class="text-3xl font-black text-gray-900 tracking-tight">DataWallet</h1>
            <p class="text-sm text-gray-500 mt-1" id="texto-boas-vindas">Inteligência financeira na nuvem</p>
        </div>
        
        <div id="form-login" class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">E-mail</label>
                <input type="email" id="email-login" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 transition" placeholder="seu@email.com">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Senha</label>
                <input type="password" id="senha-login" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 transition" placeholder="••••••••">
            </div>
            <button onclick="efetuarLogin()" id="btn-login-desk" class="w-full bg-gray-900 text-white font-bold py-3 rounded-xl hover:bg-blue-600 transition shadow-lg flex justify-center items-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar
            </button>
            <div class="text-center mt-4">
                <button onclick="alternarTelaAuth('cadastro')" class="text-sm font-bold text-blue-600 hover:underline">Não tem conta? Cadastre-se</button>
            </div>
        </div>

        <div id="form-cadastro" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Seu Nome</label>
                <input type="text" id="nome-cad" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 transition" placeholder="Como quer ser chamado?">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">E-mail</label>
                <input type="email" id="email-cad" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 transition" placeholder="seu@email.com">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Crie uma Senha Segura</label>
                <input type="password" id="senha-cad" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 transition" placeholder="Mínimo 6 caracteres">
            </div>
            <button onclick="efetuarCadastro()" id="btn-cadastrar" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition shadow-lg flex justify-center items-center gap-2">
                <i class="fa-solid fa-user-plus"></i> Criar Conta
            </button>
            <div class="text-center mt-4">
                <button onclick="alternarTelaAuth('login')" class="text-sm font-bold text-gray-500 hover:underline">Já tem conta? Entre aqui</button>
            </div>
        </div>
    </div>
</body>
</html>
