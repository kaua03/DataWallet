<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - DataWallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' }; </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="login.js" defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Mágica do Botão: Feixe de Luz (Shine) Corrigido */
        @keyframes shimmer {
            0% { transform: translateX(-150%) skewX(-20deg); }
            100% { transform: translateX(300%) skewX(-20deg); } /* Vai muito além do limite direito */
        }
        .btn-shine { position: relative; overflow: hidden; }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.25), transparent);
            animation: shimmer 3.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-[100dvh] flex items-center justify-center p-4 relative overflow-hidden">
    
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-[20%] -left-[10%] w-[70%] h-[70%] bg-indigo-600/20 blur-[120px] rounded-full"></div>
        <div class="absolute -bottom-[20%] -right-[10%] w-[60%] h-[60%] bg-emerald-600/10 blur-[100px] rounded-full"></div>
    </div>

    <main class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-[2rem] shadow-2xl z-10 fade-in relative">
        
        <!-- O MASCOTE: Estilo Gráfico -->
        <div class="relative w-40 h-28 mx-auto mb-4 flex items-end justify-center gap-3 px-4 bg-slate-950/60 rounded-2xl border border-slate-800/80 shadow-inner py-3" id="mascot-container">
            <div class="w-7 h-12 bg-slate-800 rounded-t-lg border-t border-x border-slate-700 transition-all duration-300"></div>
            
            <div id="bar-left" class="relative w-9 h-16 bg-indigo-600/30 rounded-t-lg border-t border-x border-indigo-500/50 flex flex-col justify-start items-center pt-2 transition-all duration-300 shadow-[0_0_15px_rgba(99,102,241,0.2)]">
                <div class="relative w-4 h-4 bg-white rounded-full overflow-hidden flex items-center justify-center">
                    <div id="pupil-l" class="w-2 h-2 bg-slate-950 rounded-full transition-transform duration-75"></div>
                    <div id="eyelid-l" class="absolute inset-0 bg-indigo-900 origin-top scale-y-0 transition-transform duration-150"></div>
                </div>
            </div>

            <div id="bar-right" class="relative w-9 h-20 bg-indigo-600/40 rounded-t-lg border-t border-x border-indigo-500/60 flex flex-col justify-start items-center pt-2 transition-all duration-300 shadow-[0_0_15px_rgba(99,102,241,0.3)]">
                <div class="relative w-4 h-4 bg-white rounded-full overflow-hidden flex items-center justify-center">
                    <div id="pupil-r" class="w-2 h-2 bg-slate-950 rounded-full transition-transform duration-75"></div>
                    <div id="eyelid-r" class="absolute inset-0 bg-indigo-900 origin-top scale-y-0 transition-transform duration-150"></div>
                </div>
            </div>

            <div class="w-7 h-10 bg-slate-800 rounded-t-lg border-t border-x border-slate-700 transition-all duration-300"></div>
        </div>

        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-white tracking-tight" id="titulo-form">Acesso Seguro</h1>
            <p class="text-sm text-slate-400 font-medium mt-1" id="subtitulo-form">Analytics & Inteligência Financeira.</p>
        </div>

        <form id="form-auth" class="space-y-5">
            
            <!-- Campo: E-mail ou Usuário -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">E-mail ou Usuário</label>
                <div class="group relative flex items-center bg-slate-950 rounded-xl border border-slate-800 transition-all duration-300 focus-within:-translate-y-1 focus-within:shadow-[0_10px_25px_rgba(99,102,241,0.15)] focus-within:border-indigo-500">
                    <i class="fa-solid fa-user absolute left-4 text-slate-500 transition-colors duration-300 group-focus-within:text-indigo-400"></i>
                    <input type="text" id="email" required placeholder="Digite seu acesso..." class="w-full bg-transparent text-white pl-11 pr-4 py-3.5 outline-none font-medium">
                </div>
            </div>

            <!-- Campo: Senha -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Senha</label>
                <div class="group relative flex items-center bg-slate-950 rounded-xl border border-slate-800 transition-all duration-300 focus-within:-translate-y-1 focus-within:shadow-[0_10px_25px_rgba(99,102,241,0.15)] focus-within:border-indigo-500">
                    <i class="fa-solid fa-lock absolute left-4 text-slate-500 transition-colors duration-300 group-focus-within:text-indigo-400"></i>
                    <input type="password" id="senha" required placeholder="••••••••" class="w-full bg-transparent text-white pl-11 pr-12 py-3.5 outline-none font-medium tracking-widest">
                    <button type="button" id="toggle-pass" class="absolute right-4 text-slate-400 hover:text-indigo-400 transition-colors p-1">
                        <i id="icon-pass" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div id="box-lgpd" class="hidden items-start gap-3 mt-4 bg-slate-950/50 p-3 rounded-xl border border-slate-800/50">
                <input type="checkbox" id="check-lgpd" class="mt-1 w-4 h-4 rounded border-slate-700 text-indigo-600 bg-slate-900 focus:ring-indigo-500">
                <label for="check-lgpd" class="text-xs text-slate-400 leading-relaxed cursor-pointer select-none">
                    Declaro que li e concordo com a <a href="#" class="text-indigo-400 hover:underline font-bold">Política de Privacidade</a> e autorizo o tratamento seguro dos meus dados (LGPD).
                </label>
            </div>

            <!-- Botão Acessar -->
            <button type="submit" id="btn-submit" class="group btn-shine w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black text-lg py-4 rounded-xl shadow-[0_10px_20px_rgba(79,70,229,0.3)] hover:shadow-[0_15px_30px_rgba(79,70,229,0.5)] transition-all duration-300 hover:-translate-y-1 active:scale-[0.98] mt-6 flex items-center justify-center gap-2">
                Acessar <i class="fa-solid fa-arrow-right transition-transform duration-300 group-hover:translate-x-1.5"></i>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-slate-800 pt-6">
            <p class="text-sm text-slate-400 font-medium">
                <span id="texto-rodape">Ainda não tem cadastro?</span> 
                <button type="button" id="btn-toggle-mode" class="text-indigo-400 font-bold hover:text-indigo-300 ml-1 transition-colors">Criar Conta</button>
            </p>
        </div>
    </main>
</body>
</html>
