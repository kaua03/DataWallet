<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Dívidas - DataWallet</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- DEPENDÊNCIAS DO MOTOR -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="dividas.js" defer></script>
    
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        ::-webkit-scrollbar { display: none; }
        .scroll-suave { overflow-x: auto; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen overflow-hidden flex relative fade-in">

    <!-- MENU LATERAL (PC) -->
    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200 p-6 h-full shadow-lg z-20">
        <div class="flex items-center gap-3 mb-10">
            <i class="fa-solid fa-wallet text-blue-600 text-3xl"></i>
            <h2 class="text-2xl font-black text-gray-900 tracking-tight">DataWallet</h2>
        </div>
        
        <nav class="flex-1 space-y-2">
            <a href="movimentacoes.html" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold text-gray-500 hover:bg-gray-50 transition">
                <i class="fa-solid fa-money-bill-transfer w-5"></i> Início
            </a>
            <a href="dashboard.html" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold text-gray-500 hover:bg-gray-50 transition">
                <i class="fa-solid fa-chart-pie w-5"></i> Dashboard (Coach)
            </a>
            <!-- ATIVO (Azul) -->
            <a href="dividas.html" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold bg-blue-50 text-blue-600 transition">
                <i class="fa-solid fa-file-invoice-dollar w-5"></i> Dívidas
            </a>
            <a href="categorias.html" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold text-gray-500 hover:bg-gray-50 transition">
                <i class="fa-solid fa-layer-group w-5"></i> Categorias
            </a>
            <a href="planos.html" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold text-gray-500 hover:bg-gray-50 transition">
                <i class="fa-solid fa-bullseye w-5"></i> Planos
            </a>
        </nav>
        <button onclick="sairDoSistema()" class="flex items-center gap-3 p-3 rounded-xl font-bold text-red-500 hover:bg-red-50 transition mt-auto">
            <i class="fa-solid fa-right-from-bracket w-5"></i> Sair
        </button>
    </aside>

    <!-- ÁREA CENTRAL DE CONTEÚDO -->
    <main class="flex-1 h-full overflow-y-auto bg-gray-50 relative pb-24 md:pb-0 p-4 md:p-8">
        <section class="max-w-5xl mx-auto">
            
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black text-gray-900 flex items-center gap-2">
                    <i class="fa-solid fa-file-invoice-dollar text-blue-600"></i> Controle de Dívidas
                </h2>
                <button onclick="abrirModalDivida()" class="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl text-sm shadow-md hover:bg-blue-700 transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Nova Conta / Dívida
                </button>
            </div>

            <!-- MOTOR KANBAN DE DÍVIDAS -->
            <div class="flex flex-col md:flex-row gap-4 overflow-x-auto scroll-suave pb-4">
                
                <!-- Coluna: Atrasadas -->
                <div class="flex-1 min-w-[280px] bg-red-50 p-4 rounded-3xl border border-red-100 flex flex-col max-h-[70vh] overflow-hidden">
                    <div class="flex justify-between items-center mb-4 shrink-0">
                        <h3 class="font-bold text-red-800 text-sm uppercase">Atrasadas</h3>
                        <span class="bg-red-200 text-red-800 text-xs font-bold px-2 py-1 rounded-lg" id="total-div-atrasada">R$ 0,00</span>
                    </div>
                    <div id="col-div-atrasada" class="space-y-3 overflow-y-auto pr-1 pb-2">
                        <p class="text-xs text-gray-400"><i class="fa-solid fa-spinner fa-spin"></i> Carregando...</p>
                    </div>
                </div>

                <!-- Coluna: Este Mês -->
                <div class="flex-1 min-w-[280px] bg-blue-50 p-4 rounded-3xl border border-blue-100 flex flex-col max-h-[70vh] overflow-hidden">
                    <div class="flex justify-between items-center mb-4 shrink-0">
                        <h3 class="font-bold text-blue-800 text-sm uppercase">Este Mês</h3>
                        <span class="bg-blue-200 text-blue-800 text-xs font-bold px-2 py-1 rounded-lg" id="total-div-atual">R$ 0,00</span>
                    </div>
                    <div id="col-div-atual" class="space-y-3 overflow-y-auto pr-1 pb-2">
                        <p class="text-xs text-gray-400"><i class="fa-solid fa-spinner fa-spin"></i> Carregando...</p>
                    </div>
                </div>

                <!-- Coluna: Próximos Meses -->
                <div class="flex-1 min-w-[280px] bg-gray-100 p-4 rounded-3xl border border-gray-200 flex flex-col max-h-[70vh] overflow-hidden">
                    <div class="flex justify-between items-center mb-4 shrink-0">
                        <h3 class="font-bold text-gray-600 text-sm uppercase">Próximos Meses</h3>
                        <span class="bg-gray-200 text-gray-600 text-xs font-bold px-2 py-1 rounded-lg" id="total-div-futura">R$ 0,00</span>
                    </div>
                    <div id="col-div-futura" class="space-y-3 overflow-y-auto pr-1 pb-2">
                        <p class="text-xs text-gray-400"><i class="fa-solid fa-spinner fa-spin"></i> Carregando...</p>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- MENU INFERIOR (Celular) PADRONIZADO E SEM O "+" -->
    <nav class="md:hidden fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-md border-t border-gray-200 px-4 py-2 flex justify-between items-center z-20">
        <a href="movimentacoes.html" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition p-2"><i class="fa-solid fa-house text-lg mb-1"></i><span class="text-[10px] font-bold">Início</span></a>
        <a href="dashboard.html" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition p-2"><i class="fa-solid fa-chart-pie text-lg mb-1"></i><span class="text-[10px] font-bold">Análise</span></a>
        <a href="dividas.html" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition p-2"><i class="fa-solid fa-file-invoice-dollar text-lg mb-1"></i><span class="text-[10px] font-bold">Dívidas</span></a>
        <a href="categorias.html" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition p-2"><i class="fa-solid fa-folder-open text-lg mb-1"></i><span class="text-[10px] font-bold">Pastas</span></a>
        <a href="planos.html" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition p-2"><i class="fa-solid fa-bullseye text-lg mb-1"></i><span class="text-[10px] font-bold">Metas</span></a>
    </nav>

    <!-- O ÚNICO MODAL DESTA TELA (Nova Dívida) -->
    <div id="modal-divida" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 flex items-end md:items-center justify-center fade-in md:p-4">
        <div class="bg-white w-full md:w-[450px] rounded-t-[2.5rem] md:rounded-3xl p-6 shadow-2xl relative slide-up">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-6 md:hidden"></div>
            
            <h3 class="text-xl font-black text-gray-900 mb-6 flex items-center gap-2">
                <i class="fa-solid fa-file-invoice-dollar text-blue-600"></i> Cadastrar Conta
            </h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Descrição</label>
                    <input type="text" id="div-desc" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 font-medium" placeholder="Ex: Financiamento Carro">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Valor Total (R$)</label>
                        <input type="number" id="div-valor" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 font-medium" placeholder="1200.00">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Qtd Parcelas</label>
                        <input type="number" id="div-parcelas" value="1" min="1" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Data da 1ª Parcela (ou Vencimento)</label>
                    <input type="date" id="div-data" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 font-medium">
                </div>
            </div>
            
            <div class="flex space-x-3 mt-8">
                <button onclick="fecharModalDivida()" class="flex-1 py-4 bg-gray-100 text-gray-600 font-bold rounded-2xl hover:bg-gray-200 transition">Cancelar</button>
                <button onclick="salvarNovaDivida()" id="btn-salvar-divida" class="flex-1 py-4 bg-blue-600 text-white font-bold rounded-2xl shadow-lg hover:bg-blue-700 transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-layer-group"></i> Gerar Parcelas
                </button>
            </div>
        </div>
    </div>

</body>
</html>
