<!DOCTYPE html>
<html lang="pt-BR" class="">
<head>
    <!-- 🟢 ÍCONE DO APLICATIVO SVG (Único e Soberano) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><rect width=%22512%22 height=%22512%22 rx=%22115%22 fill=%22%234f46e5%22/><path fill=%22%23ffffff%22 transform=%22translate(102, 102) scale(0.6)%22 d=%22M64 32C28.7 32 0 60.7 0 96V416c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V192c0-35.3-28.7-64-64-64H80c-8.8 0-16-7.2-16-16s7.2-16 16-16H448c17.7 0 32-14.3 32-32s-14.3-32-32-32H64zM416 272a32 32 0 1 1 0 64 32 32 0 1 1 0-64z%22/></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Divídas - DataWallet</title>
    
    <meta name="view-transition" content="same-origin">
    
    <script>
        // Restaura o tema instantaneamente antes de renderizar (Zero Flash)
        const temaSalvo = localStorage.getItem('DataWallet_Tema') || localStorage.getItem('theme');
        if (temaSalvo === 'escuro' || temaSalvo === 'dark' || (!temaSalvo && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="config.js" defer></script>
    <script src="layout.js" defer></script>
    <script src="dividas.js" defer></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .kanban-board::-webkit-scrollbar { display: none; }
        .kanban-board { scrollbar-width: none; } 
        
        .coluna-scroll::-webkit-scrollbar { width: 4px; }
        .coluna-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .coluna-scroll::-webkit-scrollbar-thumb { background: #475569; }
        
        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing; }

        .coluna-minimizada { width: 64px !important; min-width: 64px !important; cursor: pointer; transition: all 0.3s ease; }
        .coluna-minimizada .esconder-no-min { display: none !important; }
        .coluna-minimizada .mostrar-no-min { display: flex !important; }

        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.5; transition: 0.2s; position: absolute; right: 12px; }
        .dark input::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.7; }
        input::-webkit-calendar-picker-indicator:hover { opacity: 1; }
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }

        /* 🟢 TOAST DE ELITE (GLOBAL OVERRIDE) */
        div.swal2-popup.swal2-toast {
            padding: 12px 20px !important;
            border-radius: 1rem !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2) !important;
            margin-top: 16px !important;
            margin-right: 16px !important;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }
        html.dark div.swal2-popup.swal2-toast {
            background-color: #0f172a !important; /* bg-slate-900 */
            border: 1px solid #1e293b !important; /* border-slate-800 */
            color: #f8fafc !important; /* text-slate-50 */
        }
        html:not(.dark) div.swal2-popup.swal2-toast {
            background-color: #ffffff !important;
            border: 1px solid #f1f5f9 !important; /* border-slate-100 */
            color: #0f172a !important; /* text-slate-900 */
        }
        .swal2-timer-progress-bar {
            background-color: #4f46e5 !important; /* bg-indigo-600 */
            height: 4px !important;
        }
        div.swal2-popup.swal2-toast .swal2-title {
            font-family: 'Inter', sans-serif !important;
            font-size: 0.875rem !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        div.swal2-popup.swal2-toast .swal2-html-container {
            font-family: 'Inter', sans-serif !important;
            font-size: 0.75rem !important;
            margin: 4px 0 0 0 !important;
            opacity: 0.7 !important;
        }
        div.swal2-popup.swal2-toast .swal2-icon {
            margin: 0 16px 0 0 !important;
            transform: scale(0.7) !important;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 h-[100dvh] overflow-hidden flex relative fade-in transition-colors duration-300">

    <main class="flex-1 h-full flex flex-col relative overflow-hidden w-full">
        
        <header class="p-3 md:p-8 pb-2 shrink-0 w-full max-w-7xl mx-auto">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white dark:bg-slate-900 p-5 md:p-6 rounded-2xl md:rounded-3xl border border-slate-200/60 dark:border-slate-800 shadow-sm transition-colors duration-300 relative overflow-hidden mb-4 md:mb-6">
                <div class="absolute inset-0 bg-gradient-to-r from-indigo-500/5 to-transparent pointer-events-none"></div>
                <div class="relative z-10">
                    <h2 class="text-xl md:text-3xl font-black text-slate-900 dark:text-white flex items-center gap-3">
                        <i class="fa-solid fa-file-invoice-dollar text-indigo-600 dark:text-indigo-400"></i> Gestão de Divídas
                    </h2>
                    <p class="text-xs md:text-sm font-medium text-slate-500 dark:text-slate-400 mt-1">Acompanhamento de quitação e vencimentos.</p>
                </div>
            </div>

            <!-- KPIS DE PASSIVOS -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
                <div class="bg-white dark:bg-slate-900 p-4 md:p-6 rounded-2xl md:rounded-3xl border border-slate-200/60 dark:border-slate-800 shadow-sm transition-colors duration-300 flex flex-col justify-center relative overflow-hidden group">
                    <div class="absolute -right-6 -top-6 w-16 h-16 bg-rose-50 dark:bg-rose-500/10 rounded-full transition-colors duration-300"></div>
                    <p class="text-[9px] md:text-[10px] text-rose-500 font-bold uppercase tracking-wider mb-1 relative z-10">Atrasadas</p>
                    <p class="text-[1.35rem] sm:text-2xl md:text-3xl font-black text-rose-600 dark:text-rose-400 tracking-tighter leading-none break-words relative z-10" id="kpi-atrasadas">R$ 0,00</p>
                </div>
                <div class="bg-white dark:bg-slate-900 p-4 md:p-6 rounded-2xl md:rounded-3xl border border-slate-200/60 dark:border-slate-800 shadow-sm transition-colors duration-300 flex flex-col justify-center relative overflow-hidden group">
                    <div class="absolute -right-6 -top-6 w-16 h-16 bg-amber-50 dark:bg-amber-500/10 rounded-full transition-colors duration-300"></div>
                    <p class="text-[9px] md:text-[10px] text-amber-500 font-bold uppercase tracking-wider mb-1 relative z-10">Risco (Próx. 7 Dias)</p>
                    <p class="text-[1.35rem] sm:text-2xl md:text-3xl font-black text-amber-600 dark:text-amber-400 tracking-tighter leading-none break-words relative z-10" id="kpi-risco">R$ 0,00</p>
                </div>
                <div class="bg-white dark:bg-slate-900 p-4 md:p-6 rounded-2xl md:rounded-3xl border border-slate-200/60 dark:border-slate-800 shadow-sm transition-colors duration-300 flex flex-col justify-center relative overflow-hidden group">
                    <div class="absolute -right-6 -top-6 w-16 h-16 bg-indigo-50 dark:bg-indigo-500/10 rounded-full transition-colors duration-300"></div>
                    <p class="text-[9px] md:text-[10px] text-indigo-500 font-bold uppercase tracking-wider mb-1 relative z-10">Em Aberto (Total)</p>
                    <p class="text-[1.35rem] sm:text-2xl md:text-3xl font-black text-indigo-600 dark:text-indigo-400 tracking-tighter leading-none break-words relative z-10" id="kpi-aberto">R$ 0,00</p>
                </div>
                <div class="bg-white dark:bg-slate-900 p-4 md:p-6 rounded-2xl md:rounded-3xl border border-slate-200/60 dark:border-slate-800 shadow-sm transition-colors duration-300 flex flex-col justify-center relative overflow-hidden group">
                    <div class="absolute -right-6 -top-6 w-16 h-16 bg-emerald-50 dark:bg-emerald-500/10 rounded-full transition-colors duration-300"></div>
                    <p class="text-[9px] md:text-[10px] text-emerald-500 font-bold uppercase tracking-wider mb-1 relative z-10">Total Quitado</p>
                    <p class="text-[1.35rem] sm:text-2xl md:text-3xl font-black text-emerald-600 dark:text-emerald-400 tracking-tighter leading-none break-words relative z-10" id="kpi-pagas">R$ 0,00</p>
                </div>
            </div>
        </header>

        <!-- KANBAN BOARD -->
        <section class="flex-1 overflow-y-hidden overflow-x-auto p-4 md:p-8 pt-2 pb-28 md:pb-8 kanban-board cursor-grab w-full max-w-7xl mx-auto" id="container-scroll">
            <div id="board-dividas" class="flex gap-4 md:gap-6 h-full items-start w-max">
                <div class="w-full text-center mt-20 text-slate-400 dark:text-slate-500"><i class="fa-solid fa-spinner fa-spin text-2xl"></i> Montando Kanban...</div>
            </div>
        </section>
    </main>

    <!-- BOTÃO ADICIONAR (Desktop Apenas) -->
    <button onclick="window.abrirModalNovaDivida()" class="hidden md:flex fixed bottom-10 right-10 w-16 h-16 bg-indigo-600 rounded-full shadow-[0_10px_25px_rgba(79,70,229,0.5)] items-center justify-center text-white text-2xl z-40 hover:scale-105 hover:bg-indigo-700 transition-transform border border-indigo-400 dark:border-indigo-500/50">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- MODAL DE DÍVIDAS (Limpo de excesso de transitions) -->
    <div id="modal-divida" onclick="if(event.target === this) window.fecharModalNovaDivida()" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center fade-in p-4 cursor-pointer">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl shadow-2xl p-6 md:p-8 relative border border-slate-200 dark:border-slate-800 transition-colors duration-300 cursor-default">
            
            <button type="button" onclick="window.fecharModalNovaDivida()" class="absolute top-3 right-3 w-12 h-12 rounded-full text-slate-400 hover:bg-rose-500 hover:text-white transition-colors flex items-center justify-center z-[999] bg-transparent active:scale-95"><i class="fa-solid fa-xmark text-xl pointer-events-none"></i></button>
            
            <h3 id="modal-titulo" class="text-xl font-black text-slate-900 dark:text-white mb-1 pr-10"><i class="fa-solid fa-file-signature text-indigo-500"></i> Lançar Contas</h3>
            <p id="modal-subtitulo" class="text-xs text-slate-500 dark:text-slate-400 mb-6 font-medium">Contas ou parcelamentos entram como "Pendentes".</p>
            
            <form id="form-divida" onsubmit="window.salvarDivida(event)" class="space-y-4">
                <input type="hidden" id="divida-id">
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Descrição / Nome</label>
                    <input type="text" id="divida-desc" required placeholder="Ex: Financiamento Veículo" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white rounded-xl px-4 py-3 outline-none focus:border-indigo-500 font-medium">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Valor da Parcela</label>
                        <input type="text" id="divida-valor" inputmode="numeric" oninput="aplicarMascaraMoeda(this)" required placeholder="0,00" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white rounded-xl px-4 py-3 outline-none focus:border-indigo-500 font-black">
                    </div>
                    <div class="relative">
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Vencimento</label>
                        <input type="date" id="divida-data" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white rounded-xl px-4 py-3 outline-none focus:border-indigo-500 font-medium cursor-pointer" style="color-scheme: dark;">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div id="wrapper-categoria" class="col-span-2 relative">
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Centro de Custo</label>
                        <i class="fa-solid fa-chevron-down absolute right-3 top-[38px] text-slate-400 text-[10px] pointer-events-none"></i>
                        <select id="divida-categoria" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white rounded-xl pl-4 pr-8 py-3 outline-none focus:border-indigo-500 font-medium cursor-pointer appearance-none">
                            <option value="">Carregando pastas...</option>
                        </select>
                    </div>
                    <div id="wrapper-parcelas">
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1" title="Quantidade de meses">Parcelas</label>
                        <input type="number" id="divida-parcelas" min="1" max="360" value="1" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white rounded-xl px-4 py-3 outline-none focus:border-indigo-500 font-black text-center">
                    </div>
                </div>
                <button type="submit" id="btn-salvar-divida" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3.5 rounded-xl shadow-lg shadow-indigo-500/30 mt-4 flex justify-center items-center gap-2 active:scale-95 transition-transform">
                    <i class="fa-solid fa-check"></i> Registrar Obrigação
                </button>
            </form>
        </div>
    </div>

</body>
</html>
