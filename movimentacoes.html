<!DOCTYPE html>
<html lang="pt-BR" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentações - DataWallet</title>
    
    <meta name="view-transition" content="same-origin">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="layout.js" defer></script>
    <script src="config.js" defer></script>
    <script src="movimentacoes.js" defer></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        ::-webkit-scrollbar { width: 6px; display: none; }
        
        #sidebar {
            width: 5rem;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease, background-color 0.3s;
        }
        #sidebar:hover { width: 16rem; box-shadow: 15px 0 30px rgba(0,0,0,0.05); }
        .sidebar-link { width: 3rem; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s; }
        #sidebar:hover .sidebar-link { width: 100%; }
        .sidebar-text {
            opacity: 0; transform: translateX(-10px); visibility: hidden;
            transition: all 0.2s ease-in-out; white-space: nowrap;
        }
        #sidebar:hover .sidebar-text {
            visibility: visible; opacity: 1; transform: translateX(0); transition-delay: 0.15s; 
        }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 h-[100dvh] overflow-hidden flex relative fade-in transition-colors duration-300">

    <main class="flex-1 h-full overflow-y-auto relative pb-28 md:pb-8 p-4 md:p-8">
        <section class="max-w-4xl mx-auto space-y-6">
            
            <div class="bg-[#1e2336] dark:bg-indigo-950 rounded-[2rem] p-6 md:p-8 flex flex-col md:flex-row justify-between items-center gap-6 shadow-xl shadow-slate-900/10 relative overflow-hidden transition-colors">
                <div class="absolute inset-0 bg-gradient-to-r from-indigo-500/10 to-transparent pointer-events-none"></div>
                
                <div class="relative z-10 w-full md:w-auto text-center md:text-left">
                    <div class="flex items-center justify-center md:justify-start gap-2 text-indigo-200 mb-1 font-bold text-sm">
                        <i class="fa-solid fa-building-columns"></i> Saldo Disponível
                    </div>
                    <h1 class="text-4xl md:text-5xl font-black text-white tracking-tight" id="saldo-disponivel">R$ 0,00</h1>
                </div>

                <div class="relative z-10 w-full md:w-auto flex-1 max-w-md">
                    <div class="flex items-center bg-white/10 dark:bg-black/20 rounded-2xl p-2 border border-white/10 dark:border-white/5 focus-within:border-indigo-400 transition-colors backdrop-blur-sm">
                        <button type="button" onclick="ativarMicrofone()" class="focus:outline-none hover:scale-110 transition-transform">
                            <i class="fa-solid fa-microphone text-indigo-300 ml-3 mr-2"></i>
                        </button>
                        
                        <input type="text" id="input-rapido" placeholder="Ex: Gastei 150 no ifood dia 12" class="bg-transparent border-none outline-none text-white placeholder-indigo-200/60 w-full text-sm font-medium py-2">
                        
                        <button onclick="abrirModalComTextoRapido()" class="bg-indigo-500 hover:bg-indigo-400 text-white font-bold px-5 py-2.5 rounded-xl text-sm transition-all flex items-center gap-2 whitespace-nowrap ml-2 shadow-[0_0_15px_rgba(99,102,241,0.4)]">
                            Lançar <i class="fa-solid fa-plus text-sm"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200/60 dark:border-slate-800 shadow-sm flex items-center gap-5 transition-colors">
                    <div class="w-14 h-14 rounded-2xl bg-emerald-50 dark:bg-emerald-500/10 flex items-center justify-center text-emerald-500 text-xl shadow-inner shrink-0">
                        <i class="fa-solid fa-arrow-trend-up"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-0.5">Entradas (Mês Atual)</p>
                        <p class="text-2xl font-black text-slate-900 dark:text-white" id="entradas-mes">R$ 0,00</p>
                    </div>
                </div>
                <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200/60 dark:border-slate-800 shadow-sm flex items-center gap-5 transition-colors">
                    <div class="w-14 h-14 rounded-2xl bg-rose-50 dark:bg-rose-500/10 flex items-center justify-center text-rose-500 text-xl shadow-inner shrink-0">
                        <i class="fa-solid fa-arrow-trend-down"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-0.5">Saídas Pagas (Mês Atual)</p>
                        <p class="text-2xl font-black text-slate-900 dark:text-white" id="saidas-mes">R$ 0,00</p>
                    </div>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/60 dark:border-slate-800 shadow-sm p-5 md:p-6 mt-6 transition-colors">
                
                <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 mb-6">
                    <h3 class="text-lg font-black text-slate-900 dark:text-white shrink-0">Histórico de Transações</h3>
                    <div class="flex flex-wrap items-center gap-1.5" id="mini-kpis-historico"></div>
                </div>

                <div class="flex flex-col lg:flex-row items-center gap-3 mb-6 bg-slate-50 dark:bg-slate-800/50 p-2 rounded-2xl border border-slate-200/60 dark:border-slate-700/50 transition-colors">
                    <div class="flex-1 flex items-center w-full bg-white dark:bg-slate-800 rounded-xl px-3 py-2 shadow-sm border border-slate-200 dark:border-slate-700 focus-within:border-indigo-500 transition-colors">
                        <i class="fa-solid fa-magnifying-glass text-slate-400 mr-2"></i>
                        <input type="text" id="busca-historico" oninput="aplicarFiltrosHistorico()" placeholder="Buscar nome, valor ou pasta..." class="bg-transparent outline-none w-full text-sm font-medium text-slate-700 dark:text-slate-200 dark:placeholder-slate-500">
                    </div>

                    <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
                        <div class="flex items-center gap-2 bg-white dark:bg-slate-800 px-3 py-2 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 w-full sm:w-auto transition-colors">
                            <i class="fa-solid fa-filter text-slate-400 text-xs"></i>
                            <select id="filtro-periodo" onchange="mudarTipoFiltroHistorico()" class="bg-transparent outline-none text-sm font-bold text-slate-700 dark:text-slate-300 cursor-pointer w-full sm:w-auto">
                                <option value="essa_semana">Essa Semana</option>
                                <option value="por_mes">Este Mês</option>
                                <option value="personalizado">Personalizado</option>
                                <option value="tudo">Todo o Histórico</option>
                            </select>
                        </div>

                        <div id="box-mes" class="hidden flex items-center bg-white dark:bg-slate-800 px-3 py-1.5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 w-full sm:w-auto transition-colors">
                            <input type="month" id="input-mes" onchange="aplicarFiltrosHistorico()" class="bg-transparent outline-none text-sm font-bold text-slate-700 dark:text-slate-300 cursor-pointer w-full" style="color-scheme: dark;">
                        </div>

                        <div id="box-personalizado" class="hidden flex flex-wrap items-center gap-2 bg-white dark:bg-slate-800 px-3 py-1.5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 w-full sm:w-auto justify-center transition-colors">
                            <input type="date" id="input-data-inicio" onchange="aplicarFiltrosHistorico()" class="bg-transparent outline-none text-xs font-bold text-slate-700 dark:text-slate-300 cursor-pointer" style="color-scheme: dark;">
                            <span class="text-slate-400 text-xs">até</span>
                            <input type="date" id="input-data-fim" onchange="aplicarFiltrosHistorico()" class="bg-transparent outline-none text-xs font-bold text-slate-700 dark:text-slate-300 cursor-pointer" style="color-scheme: dark;">
                        </div>
                    </div>
                </div>

                <div id="lista-transacoes" class="space-y-3">
                    <div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin text-slate-300 dark:text-slate-600 text-2xl"></i></div>
                </div>
                
                <button id="btn-toggle-historico" onclick="toggleExpandirHistorico()" class="hidden w-full mt-4 py-3 bg-slate-50 dark:bg-slate-800/50 hover:bg-indigo-50 dark:hover:bg-indigo-500/10 border border-slate-200 dark:border-slate-700 border-dashed rounded-xl text-sm font-bold text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors flex items-center justify-center gap-2 mx-auto">
                </button>
            </div>
            
        </section>
    </main>

    <!-- MODAL DE LANÇAMENTO (Com Fechamento por Clique Fora e Botão Gigante) -->
    <div id="modal-transacao" onclick="if(event.target === this) window.fecharModal()" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center fade-in p-4 cursor-pointer">
        <!-- O container do modal (cursor-default para não fechar quando clica dentro) -->
        <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl shadow-2xl p-6 relative border dark:border-slate-800 cursor-default">
            
            <!-- HITBOX AUMENTADA: w-12 h-12 para facilitar o toque no mobile, z-50 para passar por cima de tudo -->
            <button onclick="window.fecharModal()" class="absolute top-3 right-3 md:top-4 md:right-4 w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-rose-500 hover:text-white transition flex items-center justify-center z-50 active:scale-95">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            
            <h3 id="modal-titulo" class="text-xl font-black text-slate-900 dark:text-white mb-6 pr-10"><i class="fa-solid fa-money-bill-transfer text-indigo-500"></i> Lançar Valor</h3>
            
            <form id="form-transacao" onsubmit="window.salvarTransacao(event)" class="space-y-4">
                <input type="hidden" id="transacao-id">

                <div class="flex p-1 bg-slate-100 dark:bg-slate-800 rounded-xl relative z-10">
                    <label class="flex-1 text-center relative cursor-pointer">
                        <input type="radio" name="tipo" value="receita" class="peer sr-only" checked>
                        <div class="py-2 text-sm font-bold text-slate-500 dark:text-slate-400 peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:text-emerald-600 dark:peer-checked:text-emerald-400 peer-checked:shadow-sm rounded-lg transition-all">
                            <i class="fa-solid fa-arrow-down"></i> Receita
                        </div>
                    </label>
                    <label class="flex-1 text-center relative cursor-pointer">
                        <input type="radio" name="tipo" value="despesa" class="peer sr-only">
                        <div class="py-2 text-sm font-bold text-slate-500 dark:text-slate-400 peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:text-rose-600 dark:peer-checked:text-rose-400 peer-checked:shadow-sm rounded-lg transition-all">
                            <i class="fa-solid fa-arrow-up"></i> Despesa
                        </div>
                    </label>
                </div>

                <div class="relative z-10">
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Descrição</label>
                    <input type="text" id="transacao-desc" required placeholder="Ex: Salário, Mercado..." class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white rounded-xl px-4 py-2.5 outline-none focus:border-indigo-500 dark:focus:border-indigo-500 font-medium">
                </div>
                
                <div class="grid grid-cols-2 gap-4 relative z-10">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Valor (R$)</label>
                        <input type="text" id="transacao-valor" inputmode="numeric" oninput="aplicarMascaraMoeda(this)" required placeholder="0,00" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white rounded-xl px-4 py-2.5 outline-none focus:border-indigo-500 font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Data Efetiva</label>
                        <input type="date" id="transacao-data" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white rounded-xl px-4 py-2.5 outline-none focus:border-indigo-500 font-medium cursor-pointer" style="color-scheme: dark;">
                    </div>
                </div>

                <div class="relative z-10">
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Centro de Custo</label>
                    <select id="transacao-categoria" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white rounded-xl px-4 py-2.5 outline-none focus:border-indigo-500 font-medium cursor-pointer">
                        <option value="">Carregando pastas...</option>
                    </select>
                </div>

                <input type="hidden" id="transacao-paga" value="true">

                <button type="submit" id="btn-salvar-transacao" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 rounded-xl transition shadow-lg shadow-indigo-500/30 mt-4 flex justify-center items-center gap-2 relative z-10">
                    <i class="fa-solid fa-check"></i> Efetivar Transação
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL DO MICROFONE -->
    <div id="modal-microfone" class="hidden fixed inset-0 bg-slate-900/95 backdrop-blur-md z-[60] flex flex-col items-center justify-center fade-in transition-all">
        <button onclick="window.cancelarMicrofone()" class="absolute top-8 right-8 w-12 h-12 rounded-full bg-white/10 text-white hover:bg-rose-500 transition flex items-center justify-center">
            <i class="fa-solid fa-xmark text-2xl"></i>
        </button>
        
        <div class="relative flex items-center justify-center w-32 h-32 mb-12">
            <div id="mic-wave-1" class="absolute inset-0 rounded-full bg-indigo-500 opacity-60" style="transition: transform 0.1s ease-out;"></div>
            <div id="mic-wave-2" class="absolute inset-0 rounded-full bg-indigo-400 opacity-30" style="transition: transform 0.15s ease-out;"></div>
            <div class="relative z-10 w-28 h-28 bg-indigo-600 rounded-full shadow-[0_0_50px_rgba(79,70,229,0.8)] flex items-center justify-center text-white text-4xl">
                <i class="fa-solid fa-microphone"></i>
            </div>
        </div>
        
        <h3 class="text-3xl font-black text-white mb-4 tracking-tight">Ouvindo...</h3>
        <p id="texto-interim" class="text-indigo-200 text-lg md:text-xl text-center max-w-lg px-8 min-h-[4rem] italic font-medium leading-relaxed">Fale a sua transação...</p>
    </div>

</body>
</html>
