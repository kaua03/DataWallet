<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentações - DataWallet</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="movimentacoes.js" defer></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        ::-webkit-scrollbar { width: 6px; display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex relative fade-in">

    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-slate-200/60 p-6 h-full shadow-lg z-20 shrink-0">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-600/30">
                <i class="fa-solid fa-wallet text-xl"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900 tracking-tight">DataWallet</h2>
        </div>
        
        <nav class="flex-1 space-y-2">
            <a href="movimentacoes.html" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold bg-indigo-50 text-indigo-700 transition"><i class="fa-solid fa-money-bill-transfer w-5"></i> Movimentações</a>
            <a href="dashboard.html" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold text-slate-500 hover:bg-slate-50 hover:text-indigo-600 transition"><i class="fa-solid fa-chart-pie w-5"></i> Dashboard</a>
            <a href="dividas.html" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold text-slate-500 hover:bg-slate-50 hover:text-indigo-600 transition"><i class="fa-solid fa-file-invoice-dollar w-5"></i> Dívidas</a>
            <a href="categorias.html" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold text-slate-500 hover:bg-slate-50 hover:text-indigo-600 transition"><i class="fa-solid fa-tags w-5"></i> Categorias</a>
            <a href="planos.html" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold text-slate-500 hover:bg-slate-50 hover:text-indigo-600 transition"><i class="fa-solid fa-bullseye w-5"></i> Metas</a>
        </nav>
        <button onclick="sairDoSistema()" class="flex items-center gap-3 p-3 rounded-xl font-bold text-rose-500 hover:bg-rose-50 transition mt-auto"><i class="fa-solid fa-right-from-bracket w-5"></i> Sair</button>
    </aside>

    <main class="flex-1 h-full overflow-y-auto relative pb-28 md:pb-8 p-4 md:p-8">
        <section class="max-w-4xl mx-auto space-y-6">
            
            <div class="bg-[#1e2336] rounded-[2rem] p-6 md:p-8 flex flex-col md:flex-row justify-between items-center gap-6 shadow-xl shadow-slate-900/10 relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-r from-indigo-500/10 to-transparent pointer-events-none"></div>
                
                <div class="relative z-10 w-full md:w-auto text-center md:text-left">
                    <div class="flex items-center justify-center md:justify-start gap-2 text-indigo-200 mb-1 font-bold text-sm">
                        <i class="fa-solid fa-building-columns"></i> Saldo Disponível
                    </div>
                    <h1 class="text-4xl md:text-5xl font-black text-white tracking-tight" id="saldo-disponivel">R$ 0,00</h1>
                </div>

                <div class="relative z-10 w-full md:w-auto flex-1 max-w-md">
                    <div class="flex items-center bg-white/10 rounded-2xl p-2 border border-white/10 focus-within:border-indigo-400 transition-colors backdrop-blur-sm">
                        <i class="fa-solid fa-microphone text-indigo-300 ml-3 mr-2"></i>
                        <input type="text" id="input-rapido" placeholder="Ex: Recebi 2500 de salário" class="bg-transparent border-none outline-none text-white placeholder-indigo-200/60 w-full text-sm font-medium py-2">
                        <button onclick="abrirModalComTextoRapido()" class="bg-white text-slate-900 hover:bg-indigo-50 hover:text-indigo-600 font-bold px-4 py-2 rounded-xl text-sm transition-colors flex items-center gap-2 whitespace-nowrap ml-2 shadow-sm">
                            Registrar <i class="fa-solid fa-paper-plane text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-white p-6 rounded-3xl border border-slate-200/60 shadow-sm flex items-center gap-5">
                    <div class="w-14 h-14 rounded-2xl bg-emerald-50 flex items-center justify-center text-emerald-500 text-xl shadow-inner shrink-0">
                        <i class="fa-solid fa-arrow-trend-up"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Entradas (Mês Atual)</p>
                        <p class="text-2xl font-black text-slate-900" id="entradas-mes">R$ 0,00</p>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-3xl border border-slate-200/60 shadow-sm flex items-center gap-5">
                    <div class="w-14 h-14 rounded-2xl bg-rose-50 flex items-center justify-center text-rose-500 text-xl shadow-inner shrink-0">
                        <i class="fa-solid fa-arrow-trend-down"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Saídas Pagas (Mês Atual)</p>
                        <p class="text-2xl font-black text-slate-900" id="saidas-mes">R$ 0,00</p>
                    </div>
                </div>
            </div>

            <!-- MÓDULO DE HISTÓRICO COM BUSCA E FILTROS -->
            <div class="bg-white rounded-3xl border border-slate-200/60 shadow-sm p-5 md:p-6 mt-6">
                
                <!-- HEADER DO HISTÓRICO + MINI KPIs -->
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                    <div class="flex flex-col md:flex-row md:items-center gap-3 w-full">
                        <h3 class="text-lg font-black text-slate-900 shrink-0">Histórico de Transações</h3>
                        
                        <!-- PÍLULAS DE MINI KPIs (Atualizam dinamicamente com o filtro) -->
                        <div class="flex flex-wrap items-center gap-1.5" id="mini-kpis-historico">
                            <!-- Injetado via JS -->
                        </div>
                    </div>
                </div>

                <!-- BARRA DE PESQUISA E FILTROS -->
                <div class="flex flex-col lg:flex-row items-center gap-3 mb-6 bg-slate-50 p-2 rounded-2xl border border-slate-200/60">
                    
                    <div class="flex-1 flex items-center w-full bg-white rounded-xl px-3 py-2 shadow-sm border border-slate-200 focus-within:border-indigo-500 transition-colors">
                        <i class="fa-solid fa-magnifying-glass text-slate-400 mr-2"></i>
                        <input type="text" id="busca-historico" oninput="aplicarFiltrosHistorico()" placeholder="Buscar nome, valor ou pasta..." class="bg-transparent outline-none w-full text-sm font-medium text-slate-700">
                    </div>

                    <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
                        <div class="flex items-center gap-2 bg-white px-3 py-2 rounded-xl shadow-sm border border-slate-200">
                            <i class="fa-solid fa-filter text-slate-400 text-xs"></i>
                            <select id="filtro-periodo" onchange="mudarTipoFiltroHistorico()" class="bg-transparent outline-none text-sm font-bold text-slate-700 cursor-pointer">
                                <option value="por_mes">Este Mês</option>
                                <option value="tudo">Todo o Histórico</option>
                                <option value="por_ano">Por Ano</option>
                                <option value="personalizado">Personalizado</option>
                            </select>
                        </div>

                        <div id="box-mes" class="hidden flex items-center bg-white px-3 py-1.5 rounded-xl shadow-sm border border-slate-200">
                            <input type="month" id="input-mes" onchange="aplicarFiltrosHistorico()" class="bg-transparent outline-none text-sm font-bold text-slate-700 cursor-pointer">
                        </div>
                        
                        <div id="box-ano" class="hidden flex items-center bg-white px-3 py-1.5 rounded-xl shadow-sm border border-slate-200">
                            <input type="number" id="input-ano" onchange="aplicarFiltrosHistorico()" min="2000" max="2100" class="bg-transparent outline-none text-sm font-bold text-slate-700 w-20" placeholder="2026">
                        </div>

                        <div id="box-personalizado" class="hidden flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl shadow-sm border border-slate-200">
                            <input type="date" id="input-data-inicio" onchange="aplicarFiltrosHistorico()" class="bg-transparent outline-none text-xs font-bold text-slate-700 cursor-pointer">
                            <span class="text-slate-400 text-xs">até</span>
                            <input type="date" id="input-data-fim" onchange="aplicarFiltrosHistorico()" class="bg-transparent outline-none text-xs font-bold text-slate-700 cursor-pointer">
                        </div>
                    </div>
                </div>

                <!-- LISTA DE TRANSAÇÕES MINIMIZADA -->
                <div id="lista-transacoes" class="space-y-3">
                    <div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin text-slate-300 text-2xl"></i></div>
                </div>
                
                <!-- BOTÃO VER MAIS -->
                <button id="btn-ver-mais" onclick="carregarMaisTransacoes()" class="hidden w-full mt-4 py-3 bg-slate-50 hover:bg-slate-100 border border-slate-200 border-dashed rounded-xl text-sm font-bold text-slate-500 transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-chevron-down"></i> Mostrar Mais Antigas
                </button>

            </div>
            
        </section>
    </main>

    <nav class="md:hidden fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-md border-t border-slate-200 px-4 py-2 flex justify-between items-center z-40">
        <a href="movimentacoes.html" class="flex flex-col items-center text-indigo-600 transition p-2"><i class="fa-solid fa-money-bill-transfer text-lg mb-1"></i><span class="text-[10px] font-bold">Movimentar</span></a>
        <a href="dashboard.html" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition p-2"><i class="fa-solid fa-chart-pie text-lg mb-1"></i><span class="text-[10px] font-bold">Dashboard</span></a>
        <a href="dividas.html" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition p-2"><i class="fa-solid fa-file-invoice-dollar text-lg mb-1"></i><span class="text-[10px] font-bold">Dívidas</span></a>
        <a href="categorias.html" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition p-2"><i class="fa-solid fa-tags text-lg mb-1"></i><span class="text-[10px] font-bold">Categorias</span></a>
        <a href="planos.html" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition p-2"><i class="fa-solid fa-bullseye text-lg mb-1"></i><span class="text-[10px] font-bold">Metas</span></a>
    </nav>

    <!-- MODAL DE LANÇAMENTO -->
    <div id="modal-transacao" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center fade-in p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 relative">
            <button onclick="fecharModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-rose-500 hover:text-white transition flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            
            <h3 id="modal-titulo" class="text-xl font-black text-slate-900 mb-6"><i class="fa-solid fa-money-bill-transfer text-indigo-500"></i> Lançar Valor Real</h3>
            
            <form id="form-transacao" onsubmit="salvarTransacao(event)" class="space-y-4">
                <input type="hidden" id="transacao-id">

                <div class="flex p-1 bg-slate-100 rounded-xl">
                    <label class="flex-1 text-center relative cursor-pointer">
                        <input type="radio" name="tipo" value="receita" class="peer sr-only" checked>
                        <div class="py-2 text-sm font-bold text-slate-500 peer-checked:bg-white peer-checked:text-emerald-600 peer-checked:shadow-sm rounded-lg transition-all">
                            <i class="fa-solid fa-arrow-down"></i> Receita
                        </div>
                    </label>
                    <label class="flex-1 text-center relative cursor-pointer">
                        <input type="radio" name="tipo" value="despesa" class="peer sr-only">
                        <div class="py-2 text-sm font-bold text-slate-500 peer-checked:bg-white peer-checked:text-rose-600 peer-checked:shadow-sm rounded-lg transition-all">
                            <i class="fa-solid fa-arrow-up"></i> Despesa
                        </div>
                    </label>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Descrição</label>
                    <input type="text" id="transacao-desc" required placeholder="Ex: Salário, Mercado..." class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl px-4 py-2.5 outline-none focus:border-indigo-500 font-medium">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Valor (R$)</label>
                        <input type="text" id="transacao-valor" inputmode="numeric" oninput="aplicarMascaraMoeda(this)" required placeholder="0,00" class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl px-4 py-2.5 outline-none focus:border-indigo-500 font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Data Efetiva</label>
                        <input type="date" id="transacao-data" required class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl px-4 py-2.5 outline-none focus:border-indigo-500 font-medium cursor-pointer">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Centro de Custo</label>
                    <select id="transacao-categoria" required class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl px-4 py-2.5 outline-none focus:border-indigo-500 font-medium cursor-pointer">
                        <option value="">Carregando pastas...</option>
                    </select>
                </div>

                <input type="hidden" id="transacao-paga" value="true">

                <button type="submit" id="btn-salvar-transacao" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 rounded-xl transition shadow-lg shadow-indigo-500/30 mt-4 flex justify-center items-center gap-2">
                    <i class="fa-solid fa-check"></i> Efetivar Transação
                </button>
            </form>
        </div>
    </div>

</body>
</html>
