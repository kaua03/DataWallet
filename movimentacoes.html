<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentações - DataWallet</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- DEPENDÊNCIAS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="movimentacoes.js" defer></script>
    
    <style>
        ::-webkit-scrollbar { display: none; }
        
        /* ANIMAÇÕES FLUIDAS */
        .modal-bg-fade { animation: bgFade 0.3s ease-out forwards; }
        .modal-pop { animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes bgFade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { 
            from { opacity: 0; transform: scale(0.90) translateY(20px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen overflow-hidden flex relative">

    <!-- MENU LATERAL (PC) -->
    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200 p-6 h-full shadow-lg z-20">
        <div class="flex items-center gap-3 mb-10">
            <i class="fa-solid fa-wallet text-blue-600 text-3xl"></i>
            <h2 class="text-2xl font-black text-gray-900 tracking-tight">DataWallet</h2>
        </div>
        
        <nav class="flex-1 space-y-2">
            <!-- ATIVO -->
            <a href="movimentacoes.html" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold bg-blue-50 text-blue-600 transition">
                <i class="fa-solid fa-money-bill-transfer w-5"></i> Movimentações
            </a>
            <!-- INATIVOS -->
            <a href="dashboard.html" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold text-gray-500 hover:bg-gray-50 hover:text-blue-600 transition">
                <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
            </a>
            <a href="dividas.html" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold text-gray-500 hover:bg-gray-50 hover:text-blue-600 transition">
                <i class="fa-solid fa-file-invoice-dollar w-5"></i> Dívidas
            </a>
            <a href="categorias.html" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold text-gray-500 hover:bg-gray-50 hover:text-blue-600 transition">
                <i class="fa-solid fa-tags w-5"></i> Categorias
            </a>
            <a href="planos.html" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold text-gray-500 hover:bg-gray-50 hover:text-blue-600 transition">
                <i class="fa-solid fa-bullseye w-5"></i> Metas
            </a>
        </nav>
        <button onclick="sairDoSistema()" class="flex items-center gap-3 p-3 rounded-xl font-bold text-red-500 hover:bg-red-50 transition mt-auto">
            <i class="fa-solid fa-right-from-bracket w-5"></i> Sair
        </button>
    </aside>

    <!-- ÁREA CENTRAL -->
    <main class="flex-1 h-full overflow-y-auto bg-gray-50 relative pb-20 md:pb-0 p-4 md:p-8">
        <section class="max-w-5xl mx-auto">
            
            <div class="bg-gradient-to-br from-blue-900 to-gray-900 text-white p-6 md:p-10 rounded-[2rem] shadow-xl mb-6 flex flex-col md:flex-row md:items-center justify-between relative overflow-hidden">
                <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-white opacity-5 blur-2xl"></div>
                <div class="z-10">
                    <p class="text-blue-200 text-sm font-medium flex items-center gap-2"><i class="fa-solid fa-building-columns"></i> Saldo Disponível</p>
                    <h2 class="text-4xl md:text-5xl font-black mt-1 tracking-tight" id="saldo-tela">R$ 0,00</h2>
                </div>
                
                <div class="mt-6 md:mt-0 w-full md:w-[450px] bg-white/10 p-1.5 rounded-2xl flex items-center backdrop-blur-md border border-white/20 z-10 shadow-lg">
                    <button id="btn-mic" onclick="ativarMicrofone()" class="p-3 text-blue-200 hover:text-white transition cursor-pointer" title="Falar registro">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    
                    <input type="text" id="input-magico" placeholder="Ex: Recebi 2500 de salário" class="flex-1 bg-transparent outline-none text-white placeholder-blue-200 px-2 font-medium">
                    
                    <button onclick="processarFrase()" class="bg-white text-gray-900 p-3 rounded-xl hover:bg-blue-500 hover:text-white transition shadow-md flex items-center gap-2 cursor-pointer">
                        <span class="hidden md:inline font-bold text-sm">Registrar</span>
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-green-100 text-green-500 flex justify-center items-center text-xl shrink-0"><i class="fa-solid fa-arrow-trend-up"></i></div>
                    <div class="truncate">
                        <p class="text-gray-400 text-[10px] sm:text-xs font-bold uppercase truncate">Entradas (Mês)</p>
                        <p class="text-gray-800 font-black text-sm sm:text-lg truncate" id="total-entradas">R$ 0,00</p>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-red-100 text-red-500 flex justify-center items-center text-xl shrink-0"><i class="fa-solid fa-arrow-trend-down"></i></div>
                    <div class="truncate">
                        <p class="text-gray-400 text-[10px] sm:text-xs font-bold uppercase truncate">Saídas (Mês)</p>
                        <p class="text-gray-800 font-black text-sm sm:text-lg truncate" id="total-saidas">R$ 0,00</p>
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-center mb-4">
                <h3 class="text-gray-800 font-black text-lg">Histórico de Transações</h3>
            </div>
            
            <div id="lista-extrato" class="space-y-3">
                <p class="text-center text-gray-400 py-6"><i class="fa-solid fa-spinner fa-spin"></i> Puxando dados do cofre...</p>
            </div>
        </section>
    </main>

    <!-- MENU INFERIOR (Celular) PADRONIZADO E SEM O "+" -->
    <nav class="md:hidden fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-md border-t border-gray-200 px-4 py-2 flex justify-between items-center z-20">
        <a href="movimentacoes.html" class="flex flex-col items-center text-blue-600 transition p-2"><i class="fa-solid fa-money-bill-transfer text-lg mb-1"></i><span class="text-[10px] font-bold">Movimentar</span></a>
        <a href="dashboard.html" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition p-2"><i class="fa-solid fa-chart-pie text-lg mb-1"></i><span class="text-[10px] font-bold">Dashboard</span></a>
        <a href="dividas.html" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition p-2"><i class="fa-solid fa-file-invoice-dollar text-lg mb-1"></i><span class="text-[10px] font-bold">Dívidas</span></a>
        <a href="categorias.html" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition p-2"><i class="fa-solid fa-tags text-lg mb-1"></i><span class="text-[10px] font-bold">Categorias</span></a>
        <a href="planos.html" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition p-2"><i class="fa-solid fa-bullseye text-lg mb-1"></i><span class="text-[10px] font-bold">Metas</span></a>
    </nav>

    <!-- MODAL EDITÁVEL BLINDADO (Com pop-in fluído) -->
    <div id="modal-transacao" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 flex items-end md:items-center justify-center modal-bg-fade">
        <div class="bg-white w-full md:w-[450px] rounded-t-[2.5rem] md:rounded-3xl p-6 md:p-8 shadow-2xl relative overflow-y-auto max-h-[90vh] modal-pop">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-6 md:hidden"></div>
            
            <h3 class="text-xl font-black text-gray-900 mb-6 flex items-center gap-2" id="modal-titulo">
                <i class="fa-solid fa-pen-to-square text-blue-600"></i> Revisar Lançamento
            </h3>
            
            <div class="space-y-4">
                <input type="hidden" id="modal-id">

                <!-- Toggle Receita / Despesa (Ambos SEMPRE visíveis) -->
                <div class="flex gap-4">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="modal-tipo" value="despesa" class="hidden" onchange="atualizarCoresTipoModal()">
                        <div id="btn-tipo-despesa" class="border-2 border-gray-200 bg-gray-50 text-gray-400 rounded-xl p-3 flex justify-center items-center gap-2 font-bold text-sm transition-all hover:bg-gray-100 cursor-pointer">
                            <i class="fa-solid fa-arrow-trend-down"></i> Saída
                        </div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="modal-tipo" value="receita" class="hidden" onchange="atualizarCoresTipoModal()">
                        <div id="btn-tipo-receita" class="border-2 border-gray-200 bg-gray-50 text-gray-400 rounded-xl p-3 flex justify-center items-center gap-2 font-bold text-sm transition-all hover:bg-gray-100 cursor-pointer">
                            <i class="fa-solid fa-arrow-trend-up"></i> Entrada
                        </div>
                    </label>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Título Padronizado (Descrição)</label>
                    <input type="text" id="modal-desc" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 font-bold text-gray-900">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">Valor (R$)</label>
                        <input type="number" id="modal-valor" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 font-black text-gray-900" step="0.01">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">Data</label>
                        <input type="date" id="modal-data" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 font-bold text-gray-900">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Categoria Destino</label>
                    <select id="modal-cat" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 font-bold text-gray-900">
                        <!-- Preenchido via JS -->
                    </select>
                </div>
            </div>
            
            <div class="flex space-x-3 mt-8">
                <button onclick="fecharModal()" class="flex-1 py-4 bg-gray-100 text-gray-600 font-bold rounded-2xl transition hover:bg-gray-200">Cancelar</button>
                <button onclick="salvarTransacaoFinal()" id="btn-salvar-modal" class="flex-1 py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-lg flex justify-center items-center gap-2 transition">
                    <i class="fa-solid fa-check"></i> Salvar
                </button>
            </div>
        </div>
    </div>

</body>
</html>
