<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentações - DataWallet</title>
    
    <meta name="view-transition" content="same-origin">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="movimentacoes.js" defer></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Fade in limpo e simétrico */
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        ::-webkit-scrollbar { width: 6px; display: none; }

        /* A MÁGICA DA SIDEBAR HOVER NO DESKTOP COM MATEMÁTICA EXATA */
        #sidebar {
            width: 5rem; /* Exatos 80px para o modo minimizado */
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
        }
        #sidebar:hover {
            width: 16rem; /* 256px para o modo expandido */
            box-shadow: 15px 0 30px rgba(0,0,0,0.05);
        }

        /* O HACK DO BOTÃO PERFEITO */
        .sidebar-link {
            width: 3rem; 
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s;
        }
        #sidebar:hover .sidebar-link {
            width: 100%; 
        }
        
        .sidebar-text {
            opacity: 0;
            transform: translateX(-10px);
            visibility: hidden;
            transition: all 0.2s ease-in-out;
            white-space: nowrap;
        }
        #sidebar:hover .sidebar-text {
            visibility: visible;
            opacity: 1;
            transform: translateX(0);
            transition-delay: 0.15s; 
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex relative fade-in">

    <div class="hidden md:block w-20 shrink-0"></div>

    <aside id="sidebar" class="hidden md:flex flex-col bg-white border-r border-slate-200/60 py-6 px-4 h-full z-40 fixed left-0 top-0 overflow-hidden">
        
        <div class="flex items-center justify-start mb-10 h-12 px-1">
            <div class="w-10 h-10 shrink-0 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-600/30">
                <i class="fa-solid fa-wallet text-xl"></i>
            </div>
            <h2 class="sidebar-text text-2xl font-black text-slate-900 tracking-tight ml-3">DataWallet</h2>
        </div>
        
        <nav class="flex-1 space-y-2 w-full">
            <a href="movimentacoes.html" class="sidebar-link flex items-center h-12 px-3 rounded-xl font-bold bg-indigo-50 text-indigo-700 overflow-hidden">
                <div class="w-6 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-money-bill-transfer text-lg"></i>
                </div>
                <span class="sidebar-text ml-3">Movimentações</span>
            </a>
            <a href="dashboard.html" class="sidebar-link flex items-center h-12 px-3 rounded-xl font-bold text-slate-500 hover:bg-slate-50 hover:text-indigo-600 transition-colors overflow-hidden">
                <div class="w-6 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-chart-pie text-lg"></i>
                </div>
                <span class="sidebar-text ml-3">Dashboard</span>
            </a>
            <a href="dividas.html" class="sidebar-link flex items-center h-12 px-3 rounded-xl font-bold text-slate-500 hover:bg-slate-50 hover:text-indigo-600 transition-colors overflow-hidden">
                <div class="w-6 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-file-invoice-dollar text-lg"></i>
                </div>
                <span class="sidebar-text ml-3">Dívidas</span>
            </a>
            <a href="categorias.html" class="sidebar-link flex items-center h-12 px-3 rounded-xl font-bold text-slate-500 hover:bg-slate-50 hover:text-indigo-600 transition-colors overflow-hidden">
                <div class="w-6 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-tags text-lg"></i>
                </div>
                <span class="sidebar-text ml-3">Categorias</span>
            </a>
            <a href="planos.html" class="sidebar-link flex items-center h-12 px-3 rounded-xl font-bold text-slate-500 hover:bg-slate-50 hover:text-indigo-600 transition-colors overflow-hidden">
                <div class="w-6 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-bullseye text-lg"></i>
                </div>
                <span class="sidebar-text ml-3">Metas</span>
            </a>
        </nav>

        <div class="mt-auto w-full">
            <button onclick="sairDoSistema()" class="sidebar-link flex items-center h-12 px-3 rounded-xl font-bold text-rose-500 hover:bg-rose-50 transition-colors overflow-hidden">
                <div class="w-6 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-right-from-bracket text-lg"></i>
                </div>
                <span class="sidebar-text ml-3">Sair do Sistema</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 h-full overflow-y-auto relative pb-28 md:pb-8 p-4 md:p-8">
        <section class="max-w-4xl mx-auto space-y-6">
            
            <div class="bg-[#1e2336] rounded-[2rem] p-6 md:p-8 flex flex-col md:flex-row justify-between items-center gap-6 shadow-xl shadow-slate-900/10 relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-r from-indigo-500/10 to-transparent pointer-events-none"></div>
                
                <div class="relative z-10 w-full md:w-auto text-center md:text-left">
                    <div class="flex items-center justify-center md:justify-start gap-2 text-indigo-200 mb-1 font-bold text-sm">
                        <i class="fa-solid fa-building-columns"></i> Saldo Disponível
                    </div>
                    <h1 class="text-4xl md:text-5xl font-black text-white tracking-tight" id="saldo-disponivel">R$ 0,00</h1>
                </div>

                <div class="relative z-10 w-full md:w-auto flex-1 max-w-md">
                    <div class="flex items-center bg-white/10 rounded-2xl p-2 border border-white/10 focus-within:border-indigo-400 transition-colors backdrop-blur-sm">
                        <button type="button" onclick="ativarMicrofone()" class="focus:outline-none hover:scale-110 transition-transform">
                            <i class="fa-solid fa-microphone text-indigo-300 ml-3 mr-2"></i>
                        </button>
                        
                        <input type="text" id="input-rapido" placeholder="Ex: Gastei 150 no ifood dia 12" class="bg-transparent border-none outline-none text-white placeholder-indigo-200/60 w-full text-sm font-medium py-2">
                        
                        <button onclick="abrirModalComTextoRapido()" class="bg-indigo-500 hover:bg-indigo-400 text-white font-bold px-5 py-2.5 rounded-xl text-sm transition-all flex items-center gap-2 whitespace-nowrap ml-2 shadow-[0_0_15px_rgba(99,102,241,0.4)]">
                            Lançar <i class="fa-solid fa-plus text-sm"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-white p-6 rounded-3xl border border-slate-200/60 shadow-sm flex items-center gap-5">
                    <div class="w-14 h-14 rounded-2xl bg-emerald-50 flex items-center justify-center text-emerald-500 text-xl shadow-inner shrink-0">
                        <i class="fa-solid fa-arrow-trend-up"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Entradas (Mês Atual)</p>
                        <p class="text-2xl font-black text-slate-900" id="entradas-mes">R$ 0,00</p>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-3xl border border-slate-200/60 shadow-sm flex items-center gap-5">
                    <div class="w-14 h-14 rounded-2xl bg-rose-50 flex items-center justify-center text-rose-500 text-xl shadow-inner shrink-0">
                        <i class="fa-solid fa-arrow-trend-down"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Saídas Pagas (Mês Atual)</p>
                        <p class="text-2xl font-black text-slate-900" id="saidas-mes">R$ 0,00</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-3xl border border-slate-200/60 shadow-sm p-5 md:p-6 mt-6">
                
                <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 mb-6">
                    <h3 class="text-lg font-black text-slate-900 shrink-0">Histórico de Transações</h3>
                    <div class="flex flex-wrap items-center gap-1.5" id="mini-kpis-historico"></div>
                </div>

                <div class="flex flex-col lg:flex-row items-center gap-3 mb-6 bg-slate-50 p-2 rounded-2xl border border-slate-200/60">
                    <div class="flex-1 flex items-center w-full bg-white rounded-xl px-3 py-2 shadow-sm border border-slate-200 focus-within:border-indigo-500 transition-colors">
                        <i class="fa-solid fa-magnifying-glass text-slate-400 mr-2"></i>
                        <input type="text" id="busca-historico" oninput="aplicarFiltrosHistorico()" placeholder="Buscar nome, valor ou pasta..." class="bg-transparent outline-none w-full text-sm font-medium text-slate-700">
                    </div>

                    <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
                        <div class="flex items-center gap-2 bg-white px-3 py-2 rounded-xl shadow-sm border border-slate-200 w-full sm:w-auto">
                            <i class="fa-solid fa-filter text-slate-400 text-xs"></i>
                            <select id="filtro-periodo" onchange="mudarTipoFiltroHistorico()" class="bg-transparent outline-none text-sm font-bold text-slate-700 cursor-pointer w-full sm:w-auto">
                                <option value="essa_semana">Essa Semana</option>
                                <option value="por_mes">Este Mês</option>
                                <option value="personalizado">Personalizado</option>
                                <option value="tudo">Todo o Histórico</option>
                            </select>
                        </div>

                        <div id="box-mes" class="hidden flex items-center bg-white px-3 py-1.5 rounded-xl shadow-sm border border-slate-200 w-full sm:w-auto">
                            <input type="month" id="input-mes" onchange="aplicarFiltrosHistorico()" class="bg-transparent outline-none text-sm font-bold text-slate-700 cursor-pointer w-full">
                        </div>

                        <div id="box-personalizado" class="hidden flex flex-wrap items-center gap-2 bg-white px-3 py-1.5 rounded-xl shadow-sm border border-slate-200 w-full sm:w-auto justify-center">
                            <input type="date" id="input-data-inicio" onchange="aplicarFiltrosHistorico()" class="bg-transparent outline-none text-xs font-bold text-slate-700 cursor-pointer">
                            <span class="text-slate-400 text-xs">até</span>
                            <input type="date" id="input-data-fim" onchange="aplicarFiltrosHistorico()" class="bg-transparent outline-none text-xs font-bold text-slate-700 cursor-pointer">
                        </div>
                    </div>
                </div>

                <div id="lista-transacoes" class="space-y-3">
                    <div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin text-slate-300 text-2xl"></i></div>
                </div>
                
                <button id="btn-toggle-historico" onclick="toggleExpandirHistorico()" class="hidden w-full mt-4 py-3 bg-slate-50 hover:bg-indigo-50 border border-slate-200 border-dashed rounded-xl text-sm font-bold text-slate-500 hover:text-indigo-600 transition-colors flex items-center justify-center gap-2 mx-auto">
                </button>
            </div>
            
        </section>
    </main>

    <div class="md:hidden fixed bottom-6 right-6 z-40 flex items-center gap-3 flex-row-reverse">
        <button onclick="window.toggleMobileMenu()" id="fab-menu" class="w-14 h-14 rounded-full bg-indigo-600 text-white shadow-[0_4px_20px_rgba(79,70,229,0.5)] flex items-center justify-center text-xl transition-all duration-500 z-50">
            <i class="fa-solid fa-bars transition-all duration-300" id="fab-icon"></i>
        </button>

        <div id="fab-items" class="flex items-center gap-3 transition-all duration-500 transform translate-x-12 opacity-0 pointer-events-none">
            <button onclick="sairDoSistema()" class="w-10 h-10 rounded-full bg-white text-rose-500 shadow-lg flex items-center justify-center border border-slate-100">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
            <a href="planos.html" class="w-10 h-10 rounded-full bg-white text-slate-500 shadow-lg flex items-center justify-center border border-slate-100">
                <i class="fa-solid fa-bullseye"></i>
            </a>
            <a href="categorias.html" class="w-10 h-10 rounded-full bg-white text-slate-500 shadow-lg flex items-center justify-center border border-slate-100">
                <i class="fa-solid fa-tags"></i>
            </a>
            <a href="dividas.html" class="w-10 h-10 rounded-full bg-white text-slate-500 shadow-lg flex items-center justify-center border border-slate-100">
                <i class="fa-solid fa-file-invoice-dollar"></i>
            </a>
            <a href="dashboard.html" class="w-10 h-10 rounded-full bg-white text-slate-500 shadow-lg flex items-center justify-center border border-slate-100">
                <i class="fa-solid fa-chart-pie"></i>
            </a>
            <a href="movimentacoes.html" class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 shadow-lg flex items-center justify-center border border-indigo-100">
                <i class="fa-solid fa-money-bill-transfer"></i>
            </a>
        </div>
    </div>

    <div id="modal-transacao" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center fade-in p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 relative">
            <button onclick="window.fecharModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-rose-500 hover:text-white transition flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            
            <h3 id="modal-titulo" class="text-xl font-black text-slate-900 mb-6"><i class="fa-solid fa-money-bill-transfer text-indigo-500"></i> Lançar Valor Real</h3>
            
            <form id="form-transacao" onsubmit="window.salvarTransacao(event)" class="space-y-4">
                <input type="hidden" id="transacao-id">

                <div class="flex p-1 bg-slate-100 rounded-xl">
                    <label class="flex-1 text-center relative cursor-pointer">
                        <input type="radio" name="tipo" value="receita" class="peer sr-only" checked>
                        <div class="py-2 text-sm font-bold text-slate-500 peer-checked:bg-white peer-checked:text-emerald-600 peer-checked:shadow-sm rounded-lg transition-all">
                            <i class="fa-solid fa-arrow-down"></i> Receita
                        </div>
                    </label>
                    <label class="flex-1 text-center relative cursor-pointer">
                        <input type="radio" name="tipo" value="despesa" class="peer sr-only">
                        <div class="py-2 text-sm font-bold text-slate-500 peer-checked:bg-white peer-checked:text-rose-600 peer-checked:shadow-sm rounded-lg transition-all">
                            <i class="fa-solid fa-arrow-up"></i> Despesa
                        </div>
                    </label>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Descrição</label>
                    <input type="text" id="transacao-desc" required placeholder="Ex: Salário, Mercado..." class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl px-4 py-2.5 outline-none focus:border-indigo-500 font-medium">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Valor (R$)</label>
                        <input type="text" id="transacao-valor" inputmode="numeric" oninput="aplicarMascaraMoeda(this)" required placeholder="0,00" class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl px-4 py-2.5 outline-none focus:border-indigo-500 font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Data Efetiva</label>
                        <input type="date" id="transacao-data" required class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl px-4 py-2.5 outline-none focus:border-indigo-500 font-medium cursor-pointer">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Centro de Custo</label>
                    <select id="transacao-categoria" required class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl px-4 py-2.5 outline-none focus:border-indigo-500 font-medium cursor-pointer">
                        <option value="">Carregando pastas...</option>
                    </select>
                </div>

                <input type="hidden" id="transacao-paga" value="true">

                <button type="submit" id="btn-salvar-transacao" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 rounded-xl transition shadow-lg shadow-indigo-500/30 mt-4 flex justify-center items-center gap-2">
                    <i class="fa-solid fa-check"></i> Efetivar Transação
                </button>
            </form>
        </div>
    </div>

    <div id="modal-microfone" class="hidden fixed inset-0 bg-slate-900/95 backdrop-blur-md z-[60] flex flex-col items-center justify-center fade-in transition-all">
        <button onclick="window.cancelarMicrofone()" class="absolute top-8 right-8 w-12 h-12 rounded-full bg-white/10 text-white hover:bg-rose-500 transition flex items-center justify-center">
            <i class="fa-solid fa-xmark text-2xl"></i>
        </button>
        
        <div class="relative flex items-center justify-center w-32 h-32 mb-12">
            <div id="mic-wave-1" class="absolute inset-0 rounded-full bg-indigo-500 opacity-60" style="transition: transform 0.1s ease-out;"></div>
            <div id="mic-wave-2" class="absolute inset-0 rounded-full bg-indigo-400 opacity-30" style="transition: transform 0.15s ease-out;"></div>
            
            <div class="relative z-10 w-28 h-28 bg-indigo-600 rounded-full shadow-[0_0_50px_rgba(79,70,229,0.8)] flex items-center justify-center text-white text-4xl">
                <i class="fa-solid fa-microphone"></i>
            </div>
        </div>
        
        <h3 class="text-3xl font-black text-white mb-4 tracking-tight">Ouvindo...</h3>
        <p id="texto-interim" class="text-indigo-200 text-lg md:text-xl text-center max-w-lg px-8 min-h-[4rem] italic font-medium leading-relaxed">Fale a sua transação...</p>
    </div>

</body>
</html>
